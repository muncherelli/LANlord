sonar.organization=muncherelli
sonar.projectKey=muncherelli_LANlord
sonar.exclusions=**/target/**,tools/**

# the icon art is generated data: one string per row of pixels, nothing to execute
sonar.coverage.exclusions=**/icon_data.rs

# the samba and dnsmasq containers have to run as root: smbd and nmbd bind ports 137-139 and
# 445 and switch to the user of each connection; dnsmasq binds ports 53 and
# 67 and needs raw sockets for dhcp
sonar.issue.ignore.multicriteria=samba-root,samba-share-dir,dnsmasq-root,timesyncd-config
sonar.issue.ignore.multicriteria.samba-root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.samba-root.resourceKey=**/nt4-domain/image/Dockerfile
sonar.issue.ignore.multicriteria.dnsmasq-root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.dnsmasq-root.resourceKey=**/dns/image/Dockerfile

# the samba data directory must be traversable by domain users (the parent /opt/lanlord is private)
sonar.issue.ignore.multicriteria.samba-share-dir.ruleKey=ansible:S2612
sonar.issue.ignore.multicriteria.samba-share-dir.resourceKey=**/nt4-domain.yml

# the time server list is ordinary system configuration, with no secrets in it: systemd reads
# /etc/systemd/timesyncd.conf.d as any user, so the directory is 0755 and the drop-in 0644
sonar.issue.ignore.multicriteria.timesyncd-config.ruleKey=ansible:S2612
sonar.issue.ignore.multicriteria.timesyncd-config.resourceKey=**/playbooks/site.yml
