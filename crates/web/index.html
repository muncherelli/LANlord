<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- the desktop sets the full title, with its version, once it starts -->
    <title>LANlord Server</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <!-- the gui's own icon; trunk copies it into the build output -->
    <link data-trunk rel="icon" href="../ui/assets/icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #008080;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="lanlord"></canvas>
  </body>
</html>
