<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- the desktop sets the full title, with its version, once it starts -->
    <title>LANlord Server</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" />
    <!-- the hand-drawn 16 and 32 pixel logo; trunk copies it into the build output -->
    <link data-trunk rel="icon" href="../ui/assets/favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #008080;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* shown only when the desktop could not start */
      #lanlord-status {
        position: fixed;
        inset: 40% 10% auto 10%;
        padding: 12px 16px;
        background: #c0c0c0;
        color: #000;
        border: 2px outset #fff;
        font: 14px sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="lanlord"></canvas>
    <div id="lanlord-status" hidden></div>
  </body>
</html>
