[package]
name = "lanlord-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# show the made-up demo server instead of talking to the gateway (`tools/build-web.sh --features demo`)
demo = ["lanlord-ui/demo"]

# the browser entry only; on a desktop the crate is empty
[target.'cfg(target_arch = "wasm32")'.dependencies]
lanlord-ui = { version = "0.1.0", path = "../ui", default-features = false }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Document", "Element", "HtmlCanvasElement", "Window", "console"] }
