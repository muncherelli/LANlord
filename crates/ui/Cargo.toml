[package]
name = "lanlord-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
# the desktop window: ssh sign-in, updates and the prefs file; none of it builds for the browser
native = ["dep:lanlord-core", "lanlord-app/native"]
# the browser demo: the made-up in-memory server instead of the gateway the page came from
demo = ["lanlord-app/fake"]

# developer tools: the red bug, the debug menu and the demo desktop. never in release builds
devtools = ["lanlord-app/fake"]

[dependencies]
anyhow.workspace = true
lanlord-app.workspace = true
lanlord-core = { version = "0.1.6", path = "../core", optional = true }
lanlord-model.workspace = true
web-time = "1.1"
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Location", "Window"] }

[dev-dependencies]
lanlord-app = { workspace = true, features = ["fake", "native"] }
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
