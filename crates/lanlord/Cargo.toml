[package]
name = "lanlord"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui"]
# the native window; build without it for headless servers
gui = ["dep:lanlord-ui"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
lanlord-core = { path = "../core" }
lanlord-tui = { path = "../tui" }
lanlord-ui = { path = "../ui", optional = true }
