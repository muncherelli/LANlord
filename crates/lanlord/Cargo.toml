[package]
name = "lanlord"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui"]
# the native window; build without it for headless servers
gui = ["dep:lanlord-ui"]
# the red bug and debug menu in the desktop window (`tools/dev.sh gui` turns it on)
devtools = ["gui", "lanlord-ui/devtools", "lanlord-tui/devtools"]
# the web server that runs on a gateway; off for the desktop build
webui = [
    "dep:axum",
    "dep:base64",
    "dep:futures-core",
    "dep:percent-encoding",
    "dep:sha2",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = { version = "0.22", optional = true }
clap.workspace = true
futures-core = { version = "0.3", optional = true }
lanlord-core = { path = "../core" }
lanlord-model.workspace = true
lanlord-tui = { path = "../tui" }
lanlord-ui = { path = "../ui", optional = true }
percent-encoding = { version = "2", optional = true }
rpassword = "7.5.5"
serde_json.workspace = true
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "signal", "macros", "fs", "time", "io-util", "sync"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["fs", "timeout"], optional = true }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "net", "macros", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# writes start menu shortcuts without com
mslnk = "0.1.8"
