[package]
name = "lanlord"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gui"]
# the native window; build without it for headless servers
gui = ["dep:lanlord-ui"]
# the web server that runs on a gateway; off for the desktop build
webui = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
clap.workspace = true
lanlord-core = { path = "../core" }
lanlord-tui = { path = "../tui" }
lanlord-ui = { path = "../ui", optional = true }
rpassword = "7.5.5"
tokio = { version = "1", default-features = false, features = ["rt", "net", "signal", "macros", "fs"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "net", "macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
