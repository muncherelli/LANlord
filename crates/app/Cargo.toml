[package]
name = "lanlord-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the LANlord app layer: state, layout and actions shared by the gui, tui and web ui"

[features]
default = ["native"]
# the desktop backends: ssh to a gateway (client mode) and the gateway itself (server mode),
# the hosts file and the log bus; none of it builds for the browser
native = ["dep:lanlord-core"]
# the in-memory gateway the tests and the browser demo run against
fake = []

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lanlord-core = { version = "0.1.0", path = "../core", optional = true }
lanlord-model.workspace = true
serde_json.workspace = true
web-time = "1.1"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "Crypto", "Request", "RequestInit", "Response", "Window"] }
