[package]
name = "lanlord-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the red bug and debug menu in the terminal desktop (`tools/dev.sh` turns it on)
devtools = ["lanlord-app/fake"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lanlord-app = { path = "../app" }
lanlord-core = { path = "../core" }
ratatui = "0.30.2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
lanlord-app = { path = "../app", features = ["fake"] }
lanlord-model.workspace = true
