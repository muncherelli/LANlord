# the nt4 server module: samba in docker for old windows clients, bound to the lanlord networks
# only. each server in the `nt4-servers:` list is one container, as an nt4-style domain controller
# (role: pdc) or a plain workgroup server (role: workgroup). the docker module must have been
# applied first. it does nothing until your settings have an `nt4-servers:` list.
#
# domains:
#   RETRONET:                    # the domain name; you choose
#     backend: nt4
#     roaming_profiles: false    # true stores users' profiles on the server (a profiles share)
#     machines: [ws1, ws2]       # computers to create accounts for in advance; join them without
#                                # ticking "Create a Computer Account in the Domain"
# nt4-servers:
#   - name: nt4-domain           # the id. this one keeps the container lanlord-nt4 and /opt/lanlord/nt4;
#                                # any other is lanlord-nt4-<name> with its data in /opt/lanlord/nt4/<name>
#     role: pdc                  # or workgroup (then `workgroup: NAME` instead of `domain:`)
#     domain: RETRONET           # a key of `domains`
#     netbios_name: LANLORD      # the server's name; default: this machine's hostname
#     network: retronet          # which lanlord network it is on; default: the first (see networks.yml)
#     address: 172.16.120.1/22   # default: that network's address
#     wins: serve                # or off; one server per network serves wins
#     software: false            # true adds a software share (S: at logon): domain users read it,
#                                # domain admins and users with software_admin write to it
#
# a server taken out of the list loses its container, never its data folder.
#
# the logins and the samba tuning keys are still in the `nt4-domain:` section:
#
# nt4-domain:
#   admin_password: change-me    # domain mode: the "Administrator" that joins machines
#   users:
#     - name: dana
#       password: change-me
#       admin: true          # a domain admin (member of Domain Admins) when the account is created
#       software_admin: true # may write to the software share without being a domain admin (when created)
#     # settings decide new accounts, a password you set and state: absent. group membership of an
#     # account that exists is whatever User Manager for Domains made of it; apply never reverts it
#     - name: olduser
#       state: absent
- name: lanlord nt4 servers
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [nt4-domain]
  vars:
    # the image holds only samba; the scripts and config are mounted from here when it runs
    image_dir: /opt/lanlord/playbooks/nt4-domain/image
    # the image is pinned to the lanlord release that runs this playbook (lanlord passes the image version as an extra var)
    image_version: "{{ lanlord_image_version }}"
    image: "ghcr.io/muncherelli/lanlord-nt4-server-components:{{ image_version }}"
    nt4_root: /opt/lanlord/nt4
  tasks:
    - name: read the nt4 servers
      ansible.builtin.include_tasks: nt4-plan.yml

    - name: check that docker is installed
      ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      changed_when: false
      when: nt4_listed

    - name: make the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ nt4_root }}"
        - "{{ nt4_root }}/bin"
      when: nt4_listed

    # when the image cannot be pulled (offline, or the package is private) the same Dockerfile
    # is built here, from the source tarball
    - name: pull the published image
      ansible.builtin.command:
        argv: [docker, pull, --quiet, "{{ image }}"]
      register: image_pull
      changed_when: false
      failed_when: false
      when: nt4_listed and nt4_servers | length > 0

    - name: build the image here when it could not be pulled
      ansible.builtin.command:
        argv: [docker, build, --quiet, --build-arg, "IMAGE_VERSION={{ image_version }}", -t, "{{ image }}", "{{ image_dir }}"]
      changed_when: true
      when: nt4_listed and nt4_servers | length > 0 and image_pull.rc != 0

    # the scripts are mounted, so a changed script needs a new container: it is remembered as a label
    # the playbook files are not executable, so the scripts are copied to a folder that is mounted
    - name: copy the scripts the container runs
      ansible.builtin.copy:
        src: "{{ image_dir }}/{{ item }}"
        dest: "{{ nt4_root }}/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: [entrypoint.sh, lanlord-user]
      when: nt4_listed

    - name: work out the version of the scripts
      ansible.builtin.shell: cat entrypoint.sh lanlord-user | sha256sum | cut -c1-12
      args:
        chdir: "{{ nt4_root }}/bin"
      register: scripts_hash
      changed_when: false
      when: nt4_listed

    - name: look at the image the container uses
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, '{% raw %}{{.Id}}{% endraw %}', "{{ image }}"]
      register: image_id
      changed_when: false
      when: nt4_listed and nt4_servers | length > 0

    # the same steps for every server, each with its own container and data folder
    - name: run each nt4 server
      ansible.builtin.include_tasks: nt4-server.yml
      loop: "{{ nt4_servers }}"
      loop_control:
        loop_var: srv
        label: "{{ srv.name }}"
      when: nt4_listed

    # a server that left the list loses its container; its data folder stays
    - name: remove the containers of servers that are gone
      ansible.builtin.include_tasks: nt4-cleanup.yml
      when: nt4_listed

    # every server worked out the network facts (internal_interface and the like) for its own
    # network; leave them as the first server's, as they were with a single server, and not as the
    # last one's
    - name: leave the network facts as the first server's
      ansible.builtin.include_tasks: networks.yml
      vars:
        net_primary_name: "{{ (nt4_servers | first).network | default('') }}"
      when: nt4_listed and nt4_servers | length > 1

    # the content-hash tags of earlier versions, once nothing runs them
    - name: remove the old hash-tagged images
      ansible.builtin.shell: |
        for img in $(docker image ls --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' | grep -E '/lanlord-samba-nt4:|^lanlord-samba-nt4:'); do
          docker ps -a --filter "ancestor=$img" -q | grep -q . || docker image rm "$img" >/dev/null 2>&1 || true
        done
      changed_when: false
      when: nt4_listed
