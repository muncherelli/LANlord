# the nt4-domain module: a samba server in docker for old windows clients,
# bound to the internal network only. as an nt4-style domain controller
# (mode: domain) or a plain workgroup server (mode: workgroup). the docker
# module must have been applied first. it does nothing until your settings
# have an `nt4-domain:` section.
#
# nt4-domain:
#   mode: domain                 # or workgroup
#   name: RETRONET               # the domain or workgroup name; you choose
#   netbios_name: LANLORD        # the server's name; default: this machine's hostname
#   address: 172.16.120.1/22     # default: the address the internal interface already has
#   build_locally: false         # true builds the image on the gateway instead of pulling the published one
#   image: ghcr.io/you/samba     # another image name (tag is still a hash of the files)
#   admin_password: change-me    # domain mode: the "Administrator" that joins machines
#   roaming_profiles: false      # true stores users' profiles on the server (a profiles share)
#   software: false              # true adds a software share (S: at logon): domain users read it,
#                                # domain admins and users with software_admin write to it
#   machines: [ws1, ws2]         # computers to create accounts for in advance; join them without
#                                # ticking "Create a Computer Account in the Domain"
#   users:
#     - name: dana
#       password: change-me
#       admin: true          # a domain admin (member of Domain Admins)
#       software_admin: true # may write to the software share without being a domain admin
#     - name: olduser
#       state: absent
- name: lanlord nt4 domain
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [nt4-domain]
  vars:
    # the tag is a hash of the files the image is built from, so one tag is one content
    image: "{{ (lookup('ansible.builtin.vars', 'nt4-domain', default={})).image | default('ghcr.io/muncherelli/lanlord-samba-nt4') }}"
    image_dir: /opt/lanlord/playbooks/nt4-domain/image
    container: lanlord-nt4
    state_dir: /opt/lanlord/nt4
  tasks:
    # a hyphenated name cannot be written as a variable, so look it up
    - name: read the nt4-domain settings
      ansible.builtin.set_fact:
        nt4: "{{ lookup('ansible.builtin.vars', 'nt4-domain') }}"
      when: "lookup('ansible.builtin.varnames', '^nt4-domain$', wantlist=True) | length > 0"

    - name: work out the internal network interface and its address
      ansible.builtin.include_tasks: network.yml
      when: nt4 is defined

    - name: work out the defaults
      ansible.builtin.set_fact:
        nt4_mode: "{{ nt4.mode | default('') }}"
        nt4_name: "{{ nt4.name | default('') | upper }}"
        nt4_netbios_name: "{{ (nt4.netbios_name | default(ansible_facts['hostname']) | upper)[:15] }}"
        nt4_address: "{{ nt4.address | default(internal_address | default('')) }}"
      when: nt4 is defined

    - name: check the settings
      ansible.builtin.assert:
        that:
          - nt4_mode in ['domain', 'workgroup']
          - nt4_name is match('^[A-Z0-9][A-Z0-9_-]{0,14}$')
          - nt4_netbios_name is match('^[A-Z0-9][A-Z0-9_-]{0,14}$')
          - nt4_address is match('^[0-9.]+/[0-9]{1,2}$')
          - nt4_mode == 'workgroup' or (nt4.admin_password | default('')) | length > 0
          - (nt4.machines | default([])) | select('match', '^[A-Za-z][A-Za-z0-9-]{0,14}$') | list | length == (nt4.machines | default([])) | length
        fail_msg: >-
          nt4-domain settings: mode must be domain or workgroup; name is the domain or workgroup
          (up to 15 letters, digits, - or _); address looks like 172.16.120.1/22 (the internal interface needs an ipv4 address);
          a domain needs an admin_password
      when: nt4 is defined

    - name: check that docker is installed
      ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      changed_when: false
      when: nt4 is defined

    - name: make the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ state_dir }}"
        - "{{ state_dir }}/config"
      when: nt4 is defined

    # samba's directory holds the shares, so domain users must be able to pass through it; the
    # password database stays in its own root-only folder and the parent /opt/lanlord is private
    - name: make samba's data directory passable
      ansible.builtin.file:
        path: "{{ state_dir }}/lib"
        state: directory
        mode: "0751"
      when: nt4 is defined

    - name: write the samba configuration
      ansible.builtin.template:
        src: nt4-domain/smb.conf.j2
        dest: "{{ state_dir }}/config/smb.conf"
        mode: "0640"
      register: smb_conf
      when: nt4 is defined

    - name: work out the image tag from the files it is built from
      ansible.builtin.shell: cat Dockerfile entrypoint.sh lanlord-user | sha256sum | cut -c1-12
      args:
        chdir: "{{ image_dir }}"
      register: image_hash
      changed_when: false
      when: nt4 is defined

    - name: pull the published image
      ansible.builtin.command: "docker pull --quiet {{ image }}:{{ image_hash.stdout }}"
      register: image_pull
      changed_when: false
      failed_when: false
      when: nt4 is defined and not (nt4.build_locally | default(false))

    # not published yet, or the package is private: build the same image here
    - name: build the image here when it could not be pulled
      ansible.builtin.command: "docker build --quiet -t {{ image }}:{{ image_hash.stdout }} {{ image_dir }}"
      changed_when: false
      when: nt4 is defined and (nt4.build_locally | default(false) or image_pull.rc != 0)

    - name: see which image the container uses
      ansible.builtin.command: "docker inspect --format '{% raw %}{{.State.Running}} {{.Config.Image}}{% endraw %}' {{ container }}"
      register: current
      changed_when: false
      failed_when: false
      when: nt4 is defined

    - name: replace the container when it is new, stopped or out of date
      when: >-
        nt4 is defined and (current.stdout != 'true ' ~ image ~ ':' ~ image_hash.stdout
        or smb_conf is changed)
      block:
        - name: replace the container, keeping the old one until the new one is healthy
          ansible.builtin.include_tasks: replace-container.yml
          vars:
            rc_name: "{{ container }}"
            rc_health: "docker exec {{ container }} smbcontrol smbd ping"
            rc_retries: 20
            rc_run: >-
              docker run -d --name {{ container }} --network host --restart unless-stopped
              -v {{ state_dir }}/lib:/var/lib/samba
              -v {{ state_dir }}/config/smb.conf:/etc/samba/smb.conf:ro
              {{ image }}:{{ image_hash.stdout }}

    - name: wait for samba to answer
      ansible.builtin.command: "docker exec {{ container }} smbcontrol smbd ping"
      register: samba_ping
      until: samba_ping.rc == 0
      retries: 20
      delay: 2
      changed_when: false
      when: nt4 is defined

    - name: set the domain administrator's password
      ansible.builtin.command: "docker exec -i {{ container }} lanlord-user admin"
      args:
        stdin: "{{ nt4.admin_password }}"
      no_log: true
      changed_when: false
      when: nt4 is defined and nt4_mode == 'domain'

    - name: create machine accounts in advance
      ansible.builtin.command: "docker exec {{ container }} lanlord-user machine {{ item | lower }}"
      loop: "{{ nt4.machines | default([]) }}"
      register: machine_results
      changed_when: "'created' in machine_results.stdout"
      when: nt4 is defined and nt4_mode == 'domain'

    - name: create or update the users
      ansible.builtin.command: "docker exec -i {{ container }} lanlord-user add {{ item.name }} {{ 'admin' if item.admin | default(false) else 'user' }}{{ ' software' if item.software_admin | default(false) else '' }}"
      args:
        stdin: "{{ item.password }}"
      loop: >-
        {{ (nt4.users | default([]) | rejectattr('state', 'defined') | list)
           + (nt4.users | default([]) | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'absent') | list) }}
      loop_control:
        label: "{{ item.name }}"
      register: user_results
      changed_when: "'created' in user_results.stdout"
      no_log: true
      when: nt4 is defined

    - name: remove the users marked absent
      ansible.builtin.command: "docker exec {{ container }} lanlord-user delete {{ item.name }}"
      loop: "{{ nt4.users | default([]) | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: user_removed
      changed_when: "'deleted' in user_removed.stdout"
      when: nt4 is defined

    # nt4 and windows 9x run this at every logon; it needs dos line endings. your own scripts are
    # netlogon\logon.bat (everyone) and netlogon\<user>.bat (one user), which domain admins can edit
    - name: write the logon script
      ansible.builtin.copy:
        dest: "{{ state_dir }}/lib/netlogon/lanlord.bat"
        mode: "0644"
        content: '{{ logon_lines | join(crlf) }}{{ crlf }}'
      vars:
        crlf: "\r\n"
        unc: '{{ "\\" ~ nt4_netbios_name }}'
        logon_lines:
          - '@echo off'
          - '{{ ("net use S: " ~ unc ~ "\software /persistent:no") if nt4.software | default(false) else "" }}'
          - 'if exist {{ unc }}\netlogon\logon.bat call {{ unc }}\netlogon\logon.bat'
          - 'if exist {{ unc }}\netlogon\%USERNAME%.bat call {{ unc }}\netlogon\%USERNAME%.bat'
      when: nt4 is defined and nt4_mode == 'domain'

    - name: list the accounts
      ansible.builtin.command: "docker exec {{ container }} lanlord-user list"
      register: accounts
      changed_when: false
      when: nt4 is defined

    - name: report
      ansible.builtin.debug:
        msg: >-
          {{ nt4_name }} is running as a {{ 'domain controller' if nt4_mode == 'domain' else 'workgroup server' }}
          named {{ nt4_netbios_name }} on {{ nt4_address.split('/')[0] }};
          accounts: {{ accounts.stdout_lines | map('split', ':') | map('first') | list }}
      when: nt4 is defined
