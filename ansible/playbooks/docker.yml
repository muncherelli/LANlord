# the docker module: docker itself, an address for the internal (retro) network
# and a firewall that keeps netbios and smb off the host network. the docker engine,
# its service and the base firewall (host network only) always run, even with no settings;
# anything that touches an interface or an address waits for a `docker:` or `networks:`
# section. it works on lxc containers, virtual machines and bare metal.
#
# docker:
#   internal_address: 172.16.120.2/22   # an extra address on the internal network; optional,
#                                       # most setups just use the address it already has
#
# no lanlord network has internet access by default. a network's `internet: true`, or a computer
# in its `internet_allow` list (by mac, for good or with an `until` time in utc), turns on ip
# forwarding (/etc/sysctl.d/60-lanlord.conf), the forward and nat chains of the firewall, and
# docker's `"ip-forward-no-drop": true` when docker would drop the forwarded traffic. with none of
# them the firewall only drops what the lanlord networks forward, and nothing is routed.
#
# sshd is closed to the lanlord networks by the firewall unless a network's `ssh: true`, or a computer
# in its `ssh_allow` list (same shape as `internet_allow`), says otherwise. the ports are read from
# `sshd -T`; the host network is not touched.
#
# the interfaces come from the shared `network:` settings (see network.yml); docker.host_interface
# and docker.internal_interface still work.
- name: lanlord docker
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [docker]
  tasks:
    - name: check the interface names and address in your settings
      ansible.builtin.assert:
        that:
          - docker.host_interface | default('x') is match('^[A-Za-z0-9_.:-]{1,15}\\Z')
          - docker.internal_interface | default('x') is match('^[A-Za-z0-9_.:-]{1,15}\\Z')
          - docker.internal_address | default('10.0.0.1/8') is match('^[0-9a-fA-F:.]+/[0-9]{1,3}\\Z')
        fail_msg: "docker settings: interface names and the address need a plain value like eth1 and 172.16.120.2/22"
      when: docker is defined

    # docker needs the proxmox features nesting and keyctl when it runs in an lxc container;
    # say so before installing anything. this runs the same probe as `lanlord doctor` and the
    # apply gate, so they always agree: only a definite "no" counts, and a probe that cannot
    # tell (or fails) stops nothing.
    - name: look at this machine
      ansible.builtin.script: "{{ playbook_dir }}/doctor-probe.sh"
      register: doctor
      changed_when: false
      failed_when: false

    - name: work out which lxc features are definitely missing
      ansible.builtin.set_fact:
        lxc_missing: >-
          {{ ((['nesting'] if 'nesting=no' in lines else [])
              + (['keyctl'] if 'keyctl=no' in lines and 'uid_map=0 0 4294967295' not in lines else []))
             | join(' and ') }}
      vars:
        lines: "{{ doctor.stdout_lines | default([]) if 'virt_container=lxc' in (doctor.stdout_lines | default([])) else [] }}"

    - name: stop when an lxc container lacks nesting or keyctl
      ansible.builtin.assert:
        that: lxc_missing == ''
        fail_msg: >-
          this server cannot run docker yet: this lxc container is missing {{ lxc_missing }}.
          fix: {{ pct_fix if 'pve_marker=1' in lines else incus_fix if 'pve_marker=0' in lines else 'on proxmox: ' ~ pct_fix ~ ' on incus or lxd: ' ~ incus_fix }}
      vars:
        lines: "{{ doctor.stdout_lines | default([]) }}"
        pct_fix: >-
          on the proxmox host run `pct set <CTID> --features nesting=1,keyctl=1`
          (replace <CTID> with this container's number) and restart the container with
          `pct reboot <CTID>`; lanlord cannot do this from inside the container
        incus_fix: >-
          on the incus or lxd host run `incus config set <name> security.nesting=true`
          (replace <name> with this container's name; lxd uses `lxc config set`) and restart
          it with `incus restart <name>`; incus allows keyctl by default, so if keyctl is
          missing check `incus config show <name>` for a seccomp setting that blocks it;
          lanlord cannot do this from inside the container

    # with settings, the shared network tasks work out the host network and the lanlord networks.
    # without, only the host network is read (the base firewall needs it) and nothing else is
    # looked at, so no interface is ever picked or configured.
    - name: work out the host network and the lanlord networks
      ansible.builtin.include_tasks: networks.yml
      when: docker is defined or networks is defined

    - name: read the host network, with no lanlord networks
      ansible.builtin.set_fact:
        host_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('') }}"
        lanlord_networks: []
      when: docker is not defined and networks is not defined

    - name: say what this machine is
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts['virtualization_type'] | default('bare metal') or 'bare metal' }};
          host network {{ host_interface | default('unknown', true) }}, lanlord networks
          {{ lanlord_networks | map(attribute='interface') | join(', ') if lanlord_networks | length > 0 else 'none' }}

    - name: install docker on arch
      ansible.builtin.command: pacman -S --needed --noconfirm docker
      register: pacman_docker
      changed_when: "'there is nothing to do' not in pacman_docker.stdout"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: install docker on debian
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: start docker
      block:
        - name: start docker now and at boot
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started
      rescue:
        - name: explain why docker did not start
          ansible.builtin.fail:
            msg: >-
              docker did not start.
              {{ 'an lxc container needs the nesting and keyctl features turned on in proxmox.'
                 if ansible_facts['virtualization_type'] | default('') == 'lxc' else '' }}

    - name: check which storage driver docker picked
      ansible.builtin.command: docker info --format '{% raw %}{{.Driver}}{% endraw %}'
      register: storage_driver
      changed_when: false

    # docker 29 calls its overlay driver overlayfs, older versions overlay2
    - name: warn when docker is not using an overlay driver
      ansible.builtin.debug:
        msg: >-
          docker uses the {{ storage_driver.stdout }} storage driver instead of overlay.
          on zfs give /var/lib/docker its own ext4 volume.
      when: storage_driver.stdout not in ['overlay2', 'overlayfs']

    # no image pull, so this works offline
    - name: check that the docker engine answers
      ansible.builtin.command: docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
      register: docker_version
      changed_when: false

    # a lanlord network has no internet unless the settings say so (a whole network, or computers
    # on it, for good or until a time). only then does this machine forward and translate.
    - name: work out whether anything on the lanlord networks goes out to the internet
      ansible.builtin.set_fact:
        internet_needed: "{{ lanlord_networks | selectattr('internet_any') | list | length > 0 }}"
        internet_machines: "{{ lanlord_networks | rejectattr('internet') | map(attribute='internet_allow') | flatten | list | length > 0 }}"
        internet_timed: "{{ lanlord_networks | map(attribute='internet_allow') | flatten | selectattr('until', 'ne', none) | list | length > 0 or lanlord_networks | map(attribute='ssh_allow') | flatten | selectattr('until', 'ne', none) | list | length > 0 }}"
        ssh_machines: "{{ lanlord_networks | rejectattr('ssh') | map(attribute='ssh_allow') | flatten | list | length > 0 }}"

    - name: check that there is a network to go out through
      ansible.builtin.assert:
        that: not internet_needed or (host_interface | default('')) != ''
        fail_msg: "internet access is on for a lanlord network, but the host network (the way out) could not be found; set network.host_interface"

    - name: turn ip forwarding on, only while something needs it
      ansible.builtin.template:
        src: docker/sysctl.conf.j2
        dest: /etc/sysctl.d/60-lanlord.conf
        mode: "0600"
      when: internet_needed

    - name: turn ip forwarding on now
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      changed_when: false
      when: internet_needed

    # when nothing needs forwarding any more, lanlord's file goes so the next boot does not turn it
    # on. the running value is left alone: docker sets it to 1 itself and bridged containers need
    # it. the forward chain of the firewall drops what the lanlord networks forward either way.
    - name: stop turning ip forwarding on at boot
      ansible.builtin.file:
        path: /etc/sysctl.d/60-lanlord.conf
        state: absent
      when: not internet_needed

    # docker's iptables backend sets the FORWARD policy to DROP when it turns forwarding on, which
    # silently kills the nat below even though lanlord's own table accepts the traffic. docker 28
    # can be told not to ("ip-forward-no-drop"); the key is kept for as long as anything goes out,
    # and taken out again only when lanlord was the one that added it.
    - name: look at the iptables FORWARD policy
      ansible.builtin.shell: iptables -S FORWARD 2>/dev/null | sed -n 's/^-P FORWARD //p' | head -n 1
      register: forward_policy
      changed_when: false
      failed_when: false
      when: internet_needed

    - name: stop when docker drops forwarded traffic and cannot be told not to
      ansible.builtin.assert:
        that: docker_version.stdout is version('28.0', '>=')
        fail_msg: >-
          docker {{ docker_version.stdout }} sets the iptables FORWARD policy to DROP, which stops the
          internet for the lanlord networks, and it is too old for "ip-forward-no-drop" (docker 28
          has it). upgrade docker, or turn internet access off.
      when: internet_needed and forward_policy.stdout | default('') == 'DROP'

    - name: see whether docker has a daemon.json
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: daemon_json_stat
      when: docker_version.stdout is version('28.0', '>=')

    - name: read docker's daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: daemon_json
      when: >-
        docker_version.stdout is version('28.0', '>=')
        and daemon_json_stat.stat.exists | default(false)

    - name: work out docker's settings
      ansible.builtin.set_fact:
        daemon_config: "{{ (daemon_json.content | default('e30=') | b64decode | trim or '{}') | from_json }}"
      when: docker_version.stdout is version('28.0', '>=')

    - name: make a place for lanlord's firewall rules
      ansible.builtin.file:
        path: /etc/lanlord
        state: directory
        mode: "0750"

    - name: see whether lanlord added the ip-forward-no-drop key
      ansible.builtin.stat:
        path: /etc/lanlord/ip-forward-no-drop
      register: no_drop_marker
      when: docker_version.stdout is version('28.0', '>=')

    - name: remember that the key is lanlord's, when it was not there before
      ansible.builtin.copy:
        dest: /etc/lanlord/ip-forward-no-drop
        content: "added by lanlord; removed again when no network goes out\n"
        mode: "0640"
      when: >-
        internet_needed and docker_version.stdout is version('28.0', '>=')
        and 'ip-forward-no-drop' not in daemon_config

    # docker only makes /etc/docker once it needs a daemon.json
    - name: make a place for docker's daemon.json
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        mode: "0750"
      when: >-
        internet_needed and docker_version.stdout is version('28.0', '>=')
        and daemon_config['ip-forward-no-drop'] | default(false) != true

    - name: tell docker to leave the FORWARD policy alone
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ daemon_config | combine({'ip-forward-no-drop': true}) | to_nice_json }}\n"
        mode: "0600"
      register: daemon_json_written
      when: >-
        internet_needed and docker_version.stdout is version('28.0', '>=')
        and daemon_config['ip-forward-no-drop'] | default(false) != true

    - name: take the ip-forward-no-drop key out again, when lanlord added it
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ daemon_config | dict2items | rejectattr('key', 'eq', 'ip-forward-no-drop') | items2dict | to_nice_json }}\n"
        mode: "0600"
      register: daemon_json_cleaned
      when: >-
        not internet_needed and docker_version.stdout is version('28.0', '>=')
        and no_drop_marker.stat.exists | default(false) and 'ip-forward-no-drop' in daemon_config

    - name: forget the marker
      ansible.builtin.file:
        path: /etc/lanlord/ip-forward-no-drop
        state: absent
      when: not internet_needed

    - name: restart docker so it takes the setting
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: daemon_json_written is changed or daemon_json_cleaned is changed

    # the restart puts docker's policy back, and a policy that was already DROP stays: take it off
    # every run while something goes out. lanlord's forward chain still drops lan to lan.
    - name: let forwarded traffic through docker's FORWARD policy
      ansible.builtin.command: iptables -P FORWARD ACCEPT
      changed_when: false
      failed_when: false
      when: internet_needed and forward_policy.stdout | default('') == 'DROP'

    - name: work out which networks get their address, mtu and firewall settings from lanlord
      ansible.builtin.set_fact:
        lan_interfaces: "{{ lanlord_networks | map(attribute='interface') | list }}"
        lan_configured: "{{ lanlord_networks | selectattr('configure_address') | list }}"

    - name: find out which network manager is running
      ansible.builtin.shell: |
        for unit in systemd-networkd NetworkManager; do
          if systemctl is-active --quiet "$unit"; then echo "$unit"; exit 0; fi
        done
        echo none
      register: net_manager
      changed_when: false
      when: lan_configured | length > 0

    - name: stop on a network manager we cannot configure
      ansible.builtin.fail:
        msg: >-
          network manager '{{ net_manager.stdout }}' is not supported yet (systemd-networkd and
          NetworkManager are). add the addresses {{ lan_configured | map(attribute='address') | list }} to
          {{ lan_configured | map(attribute='interface') | list }} yourself and take them out of your settings.
      when: lan_configured | length > 0 and net_manager.stdout == 'none'

    - name: give every lanlord network its address and mtu
      ansible.builtin.include_tasks: network-address.yml
      loop: "{{ lan_configured | default([]) }}"
      loop_control:
        loop_var: lan
        label: "{{ lan.name }}"

    # sshd is kept off the lanlord networks by the firewall, so its ports are asked of sshd itself.
    # nothing is printed without sshd (no rule then); sshd that cannot answer is taken to be on 22
    - name: find the ports sshd listens on
      ansible.builtin.shell: |
        sshd=$(command -v sshd 2>/dev/null || true)
        if [ -z "$sshd" ]; then for c in /usr/sbin/sshd /usr/local/sbin/sshd; do
          if [ -x "$c" ]; then sshd=$c; break; fi; done; fi
        [ -n "$sshd" ] || exit 0
        ports=$("$sshd" -T 2>/dev/null | awk 'tolower($1)=="port" { print $2 }' | sort -un)
        echo "${ports:-22}"
      register: sshd_ports
      changed_when: false

    - name: remember the sshd ports
      ansible.builtin.set_fact:
        ssh_ports: "{{ sshd_ports.stdout_lines | map('int') | select | list }}"

    - name: keep netbios, smb, dns and dhcp off the host network
      ansible.builtin.template:
        src: docker/firewall.nft.j2
        dest: /etc/lanlord/firewall.nft
        mode: "0600"
        validate: nft -c -f %s
      register: firewall_rules

    - name: load the firewall at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/lanlord-firewall.service
        content: |
          [Unit]
          Description=lanlord firewall for the internal network
          After=network.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=nft -f /etc/lanlord/firewall.nft

          [Install]
          WantedBy=multi-user.target
        mode: "0640"
      register: firewall_unit

    # runs every time: a unit that failed or stopped is started again, new rules or a new unit restart it
    - name: enable the firewall and load the current rules
      ansible.builtin.systemd:
        name: lanlord-firewall
        enabled: true
        state: "{{ 'restarted' if (firewall_rules is changed or firewall_unit is changed) else 'started' }}"
        daemon_reload: true

    # the computers allowed out are added to their sets here, with the time each has left worked
    # out now from its end time; the rules file has empty sets, so a boot starts closed
    - name: write the computers allowed out
      ansible.builtin.template:
        src: docker/internet-elements.nft.j2
        dest: /etc/lanlord/internet-elements.nft
        mode: "0600"
      register: internet_elements

    - name: let the computers allowed out through
      ansible.builtin.command: nft -f /etc/lanlord/internet-elements.nft
      changed_when: false
      when: internet_machines or ssh_machines

    # a flow that is open when a grant ends, is denied, or a network goes off would carry on, so the
    # flows of the computers that may not go out are ended (quietly skipped without conntrack)
    - name: end the flows of computers that may not go out
      ansible.builtin.command:
        argv: >-
          {{ ['sh', '-c', cut_flows, 'sh', net.interface]
          + (net.internet_allow | map(attribute='mac') | map('lower') | list) }}
      vars:
        cut_flows: |
          command -v conntrack >/dev/null 2>&1 || exit 0
          iface=$1; shift
          ip -4 neigh show dev "$iface" 2>/dev/null | while read -r addr tag mac _; do
            [ "$tag" = lladdr ] || continue
            case " $* " in *" $mac "*) continue ;; esac
            conntrack -D -s "$addr" >/dev/null 2>&1 || true
          done
          exit 0
      loop: "{{ lanlord_networks | rejectattr('internet') | list }}"
      loop_control:
        loop_var: net
        label: "{{ net.name }}"
      changed_when: false

    # grants that end are dropped from the rules by nft itself; the timer takes them out of the
    # settings. only there while a grant has an end.
    - name: keep the settings clean of internet grants that ended
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0640"
        content: "{{ item.content }}"
      loop:
        - name: lanlord-internet-prune.service
          content: |
            [Unit]
            Description=take ended LANlord internet grants out of the settings

            [Service]
            Type=oneshot
            ExecStart=/opt/lanlord/bin/lanlord internet-prune
        - name: lanlord-internet-prune.timer
          content: |
            [Unit]
            Description=look for ended LANlord internet grants

            [Timer]
            OnBootSec=60
            OnUnitActiveSec=60
            AccuracySec=5s

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      when: internet_timed

    # after a boot the sets are empty (closed); this puts back the grants that are still running
    - name: write the computers allowed out again at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/lanlord-internet-boot.service
        mode: "0640"
        content: |
          [Unit]
          Description=put the LANlord internet grants that are still running back
          After=lanlord-firewall.service

          [Service]
          Type=oneshot
          ExecStart=/opt/lanlord/bin/lanlord internet-prune --refresh

          [Install]
          WantedBy=multi-user.target
      when: internet_machines or ssh_machines

    - name: start the clean-up timer
      ansible.builtin.systemd:
        name: lanlord-internet-prune.timer
        enabled: true
        state: started
        daemon_reload: true
      when: internet_timed

    - name: enable the boot refresh
      ansible.builtin.systemd:
        name: lanlord-internet-boot.service
        enabled: true
        daemon_reload: true
      when: internet_machines or ssh_machines

    - name: stop the clean-up when no grant ends
      ansible.builtin.shell: |
        systemctl disable --now lanlord-internet-prune.timer 2>/dev/null || true
        rm -f /etc/systemd/system/lanlord-internet-prune.service /etc/systemd/system/lanlord-internet-prune.timer
        systemctl daemon-reload
      args:
        removes: /etc/systemd/system/lanlord-internet-prune.timer
      when: not internet_timed

    - name: stop the boot refresh when no computer is allowed out
      ansible.builtin.shell: |
        systemctl disable lanlord-internet-boot.service 2>/dev/null || true
        rm -f /etc/systemd/system/lanlord-internet-boot.service
        systemctl daemon-reload
      args:
        removes: /etc/systemd/system/lanlord-internet-boot.service
      when: not (internet_machines or ssh_machines)

    - name: report
      ansible.builtin.debug:
        msg: >-
          docker is running ({{ storage_driver.stdout }});
          {{ host_interface | default('the host network', true) }} drops netbios and smb and the lanlord networks
          ({{ lan_interfaces | join(', ') if lan_interfaces | length > 0 else 'none' }}) are left alone
