# the docker module: docker itself, an address for the internal (retro) network
# and a firewall that keeps netbios and smb off the host network. the docker engine,
# its service and the base firewall (host network only) always run, even with no settings;
# anything that touches an interface or an address waits for a `docker:` or `networks:`
# section. it works on lxc containers, virtual machines and bare metal.
#
# docker:
#   internal_address: 172.16.120.2/22   # an extra address on the internal network; optional,
#                                       # most setups just use the address it already has
#
# the interfaces come from the shared `network:` settings (see network.yml); docker.host_interface
# and docker.internal_interface still work.
- name: lanlord docker
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [docker]
  tasks:
    - name: check the interface names and address in your settings
      ansible.builtin.assert:
        that:
          - docker.host_interface | default('x') is match('^[A-Za-z0-9_.:-]{1,15}$')
          - docker.internal_interface | default('x') is match('^[A-Za-z0-9_.:-]{1,15}$')
          - docker.internal_address | default('10.0.0.1/8') is match('^[0-9a-fA-F:.]+/[0-9]{1,3}$')
        fail_msg: "docker settings: interface names and the address need a plain value like eth1 and 172.16.120.2/22"
      when: docker is defined

    # docker needs the proxmox features nesting and keyctl when it runs in an lxc container;
    # say so before installing anything. this runs the same probe as `lanlord doctor` and the
    # apply gate, so they always agree: only a definite "no" counts, and a probe that cannot
    # tell (or fails) stops nothing.
    - name: look at this machine
      ansible.builtin.script: "{{ playbook_dir }}/doctor-probe.sh"
      register: doctor
      changed_when: false
      failed_when: false

    - name: work out which lxc features are definitely missing
      ansible.builtin.set_fact:
        lxc_missing: >-
          {{ ((['nesting'] if 'nesting=no' in lines else [])
              + (['keyctl'] if 'keyctl=no' in lines and 'uid_map=0 0 4294967295' not in lines else []))
             | join(' and ') }}
      vars:
        lines: "{{ doctor.stdout_lines | default([]) if 'virt_container=lxc' in (doctor.stdout_lines | default([])) else [] }}"

    - name: stop when an lxc container lacks nesting or keyctl
      ansible.builtin.assert:
        that: lxc_missing == ''
        fail_msg: >-
          this server cannot run docker yet: this lxc container is missing {{ lxc_missing }}.
          fix: on the proxmox host run `pct set <CTID> --features nesting=1,keyctl=1`
          (replace <CTID> with this container's number) and restart the container with
          `pct reboot <CTID>`; lanlord cannot do this from inside the container

    # with settings, the shared network tasks work out the host network and the lanlord networks.
    # without, only the host network is read (the base firewall needs it) and nothing else is
    # looked at, so no interface is ever picked or configured.
    - name: work out the host network and the lanlord networks
      ansible.builtin.include_tasks: networks.yml
      when: docker is defined or networks is defined

    - name: read the host network, with no lanlord networks
      ansible.builtin.set_fact:
        host_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('') }}"
        lanlord_networks: []
      when: docker is not defined and networks is not defined

    - name: say what this machine is
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts['virtualization_type'] | default('bare metal') or 'bare metal' }};
          host network {{ host_interface | default('unknown', true) }}, lanlord networks
          {{ lanlord_networks | map(attribute='interface') | join(', ') if lanlord_networks | length > 0 else 'none' }}

    - name: install docker on arch
      ansible.builtin.command: pacman -S --needed --noconfirm docker
      register: pacman_docker
      changed_when: "'there is nothing to do' not in pacman_docker.stdout"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: install docker on debian
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: start docker
      block:
        - name: start docker now and at boot
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started
      rescue:
        - name: explain why docker did not start
          ansible.builtin.fail:
            msg: >-
              docker did not start.
              {{ 'an lxc container needs the nesting and keyctl features turned on in proxmox.'
                 if ansible_facts['virtualization_type'] | default('') == 'lxc' else '' }}

    - name: check which storage driver docker picked
      ansible.builtin.command: docker info --format '{% raw %}{{.Driver}}{% endraw %}'
      register: storage_driver
      changed_when: false

    # docker 29 calls its overlay driver overlayfs, older versions overlay2
    - name: warn when docker is not using an overlay driver
      ansible.builtin.debug:
        msg: >-
          docker uses the {{ storage_driver.stdout }} storage driver instead of overlay.
          on zfs give /var/lib/docker its own ext4 volume.
      when: storage_driver.stdout not in ['overlay2', 'overlayfs']

    - name: check that containers run
      ansible.builtin.command: docker run --rm hello-world
      changed_when: false

    - name: work out which networks get their address, mtu and firewall settings from lanlord
      ansible.builtin.set_fact:
        lan_interfaces: "{{ lanlord_networks | map(attribute='interface') | list }}"
        lan_configured: "{{ lanlord_networks | selectattr('configure_address') | list }}"

    - name: find out which network manager is running
      ansible.builtin.shell: |
        for unit in systemd-networkd NetworkManager; do
          if systemctl is-active --quiet "$unit"; then echo "$unit"; exit 0; fi
        done
        echo none
      register: net_manager
      changed_when: false
      when: lan_configured | length > 0

    - name: stop on a network manager we cannot configure
      ansible.builtin.fail:
        msg: >-
          network manager '{{ net_manager.stdout }}' is not supported yet (systemd-networkd and
          NetworkManager are). add the addresses {{ lan_configured | map(attribute='address') | list }} to
          {{ lan_configured | map(attribute='interface') | list }} yourself and take them out of your settings.
      when: lan_configured | length > 0 and net_manager.stdout == 'none'

    - name: give every lanlord network its address and mtu
      ansible.builtin.include_tasks: network-address.yml
      loop: "{{ lan_configured | default([]) }}"
      loop_control:
        loop_var: lan
        label: "{{ lan.name }}"

    - name: make a place for lanlord's firewall rules
      ansible.builtin.file:
        path: /etc/lanlord
        state: directory
        mode: "0750"

    - name: keep netbios, smb, dns and dhcp off the host network
      ansible.builtin.template:
        src: docker/firewall.nft.j2
        dest: /etc/lanlord/firewall.nft
        mode: "0600"
        validate: nft -c -f %s
      register: firewall_rules

    - name: load the firewall at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/lanlord-firewall.service
        content: |
          [Unit]
          Description=lanlord firewall for the internal network
          After=network.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/nft -f /etc/lanlord/firewall.nft

          [Install]
          WantedBy=multi-user.target
        mode: "0640"
      register: firewall_unit

    - name: enable the firewall and load the current rules
      ansible.builtin.systemd:
        name: lanlord-firewall
        enabled: true
        state: restarted
        daemon_reload: true
      when: (firewall_rules is changed or firewall_unit is changed)

    - name: report
      ansible.builtin.debug:
        msg: >-
          docker is running ({{ storage_driver.stdout }});
          {{ host_interface | default('the host network', true) }} drops netbios and smb and the lanlord networks
          ({{ lan_interfaces | join(', ') if lan_interfaces | length > 0 else 'none' }}) are left alone
