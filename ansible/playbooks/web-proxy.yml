# the web-proxy module: caddy in docker on the host network, proxying web
# requests to sites on the internal network and to the lanlord web ui. the
# docker module must have been applied first. it does nothing until your
# settings have a `web-proxy:` section. without lanlord networks (`networks: []`), a web ui only
# (no sites) and `status: {enabled: false}` it answers on the host address on the web ui port and
# nothing else.
#
# web-proxy:
#   listen: [host, internal]      # where caddy answers (the default is both, or host without an internal network): host is your normal network,
#                                 # internal (the retro network), or ipv4 addresses; a list or one value
#   tls: "off"                    # or internal, for https with caddy's own certificate authority (quote off)
#   sites:
#     - host: nostalgia.lan       # the name clients ask for
#       upstream: 172.16.120.20:80
#   webui:                        # the lanlord web ui, optional; only on the normal network, https only
#     tls: internal               # required: letsencrypt-dns, cloudflare-origin or internal (development only)
#     host: gateway.example.lan   # the name you browse to (default: the normal network address)
#     port: 8443                  # the default
#     upstream: unix//run/lanlord-web/web.sock   # the default: lanlord webui, run by systemd
#     proxy_user: root            # the account the proxy runs as: root for this module's caddy container
#                                 # (the default), or e.g. caddy for a caddy installed from a package
#   status:                       # the retronet status page on the internal address, optional
#     enabled: true               # on by default
#     host: lanlord.retronet      # default: lanlord.<dns.zone>, or lanlord.retronet without the dns module
- name: lanlord web proxy
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [web-proxy]
  vars:
    image: caddy:2-alpine
    container: lanlord-caddy
    state_dir: /opt/lanlord/caddy
    status_dir: /opt/lanlord/status
  tasks:
    # a hyphenated name cannot be written as a variable, so look it up
    - name: read the web-proxy settings
      ansible.builtin.set_fact:
        wp: "{{ lookup('ansible.builtin.vars', 'web-proxy') }}"
      when: "lookup('ansible.builtin.varnames', '^web-proxy$', wantlist=True) | length > 0"

    # the status page is on the first lanlord network
    - name: work out the host network and the first lanlord network
      ansible.builtin.include_tasks: networks.yml
      when: wp is defined

    - name: work out the defaults
      ansible.builtin.set_fact:
        proxy_listen_raw: "{{ wp.listen | default(['host', 'internal'] if (internal_ip | default('')) != '' else ['host']) }}"
        # yaml reads an unquoted `off` as the boolean false, so accept both
        proxy_tls: "{{ 'off' if (wp.tls | default('off')) in ['off', false] else wp.tls }}"
        proxy_sites: "{{ wp.sites | default([]) }}"
        webui_cfg: "{{ wp.webui | default({}) }}"
        status_enabled: "{{ (wp.status | default({})).enabled | default(true) }}"
        status_zone: "{{ (dns | default({})).zone | default('retronet') }}"
      when: wp is defined

    - name: turn the listen setting into addresses
      ansible.builtin.set_fact:
        proxy_listen: >-
          {{ ([proxy_listen_raw] if proxy_listen_raw is string else proxy_listen_raw)
             | map('replace', 'host', host_address) | map('replace', 'internal', internal_ip) | unique | list }}
      when: wp is defined

    - name: work out the status page host
      ansible.builtin.set_fact:
        status_host: "{{ (wp.status | default({})).host | default('lanlord.' ~ status_zone) }}"
      when: wp is defined

    # the web ui: https on the normal network only, and only with a certificate method
    - name: work out the web ui settings
      ansible.builtin.set_fact:
        webui_tls: "{{ 'off' if (webui_cfg.tls | default('off')) in ['off', false] else webui_cfg.tls }}"
        webui_host: "{{ webui_cfg.host | default(host_address) }}"
        webui_port: "{{ webui_cfg.port | default(8443) }}"
        webui_upstream: "{{ webui_cfg.upstream | default('unix//run/lanlord-web/web.sock') }}"
        webui_proxy_user: "{{ webui_cfg.proxy_user | default('root') }}"
      when: wp is defined

    # caddy's own certificate authority can sign every name the gateway goes by, so the web ui
    # answers to its address, short name and full name alike; a real certificate covers only host
    - name: list the names the web ui answers to
      ansible.builtin.set_fact:
        webui_names: >-
          {{ ([webui_host] + (([host_address, ansible_facts['hostname'], ansible_facts['fqdn']]
              if webui_tls == 'internal' else [])
              | select('match', '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\Z')
              | reject('equalto', 'localhost') | list)) | unique | list }}
      when: wp is defined

    - name: decide whether the web ui is served
      ansible.builtin.set_fact:
        webui_on: "{{ wp.webui is defined }}"
        webui_socket: "{{ webui_upstream[6:] if webui_upstream is match('^unix//') else '' }}"
      when: wp is defined

    # these values end up in the caddyfile, so only plain names and addresses are accepted
    - name: check the settings
      ansible.builtin.assert:
        that:
          - proxy_listen | length > 0
          - proxy_listen | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}\\Z') | list | length == proxy_listen | length
          - proxy_tls in ['off', 'internal']
          - proxy_sites | length > 0 or webui_on
          - proxy_sites | map(attribute='host') | list | length == proxy_sites | map(attribute='host') | list | unique | length
          - proxy_sites | map(attribute='host') | select('match', '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\\Z') | list | length == proxy_sites | length
          - proxy_sites | map(attribute='upstream') | select('match', '^(https?://)?[A-Za-z0-9.-]+:[0-9]{1,5}\\Z') | list | length == proxy_sites | length
          - status_enabled is boolean
          - status_host is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\\Z')
          - status_zone is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\\Z')
          - not status_enabled or status_host not in (proxy_sites | map(attribute='host') | list)
          - not status_enabled or (internal_ip | default('')) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}\\Z')
        fail_msg: >-
          web-proxy settings: listen is host, internal or ipv4 addresses (and the interface needs one), tls is off or internal, and every site
          has a unique host name like nostalgia.lan and an upstream like 172.16.120.20:80,
          and status has a boolean enabled and a host name that no site uses (the internal interface needs an address)
      when: wp is defined

    - name: check the web ui settings
      ansible.builtin.assert:
        that:
          - webui_tls in ['internal', 'letsencrypt-dns', 'cloudflare-origin']
          - webui_host is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?\\Z')
          - webui_host not in (proxy_sites | map(attribute='host') | list)
          - webui_port | string is match('^[0-9]{1,5}\\Z') and (webui_port | int) >= 1 and (webui_port | int) <= 65535
          - (webui_port | int) not in [80, 443]
          - webui_upstream is match('^unix//run/lanlord-web/[A-Za-z0-9._-]+\.sock\\Z') or webui_upstream is match('^(https?://)?[A-Za-z0-9.-]+:[0-9]{1,5}\\Z')
          - (host_address | default('')) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}\\Z')
          - webui_proxy_user is match('^[a-z_][a-z0-9_-]{0,31}\\Z')
        fail_msg: >-
          web-proxy webui settings: the web ui is https only, so tls must name a certificate method: letsencrypt-dns,
          cloudflare-origin or internal (test gateways only); remove the webui section to leave the web ui out. host is a
          plain name like gateway.example.lan that no site uses, port is a number other than 80 and 443 (8443 by default),
          upstream is unix//run/lanlord-web/<name>.sock or an address like 127.0.0.1:8080, proxy_user is an account name
          like caddy, and the normal network interface needs an address
      when: wp is defined and wp.webui is defined

    # caddy's cloudflare dns plugin is not in the stock image yet
    - name: refuse certificate methods that are not built yet
      ansible.builtin.assert:
        that: webui_tls != 'letsencrypt-dns'
        fail_msg: >-
          web-proxy webui tls letsencrypt-dns is not supported yet: it needs a caddy build with the cloudflare dns module.
          use cloudflare-origin, or internal on a test gateway
      when: wp is defined and wp.webui is defined

    - name: check the cloudflare origin certificate
      when: wp is defined and webui_on and webui_tls == 'cloudflare-origin'
      block:
        - name: look for the origin certificate and key
          ansible.builtin.stat:
            path: "{{ state_dir }}/config/{{ item }}"
          loop: [webui-origin.pem, webui-origin.key]
          register: origin_files

        - name: insist on the origin certificate and key
          ansible.builtin.assert:
            that: origin_files.results | map(attribute='stat.exists') | select | list | length == 2
            fail_msg: >-
              web-proxy webui tls cloudflare-origin needs the certificate at {{ state_dir }}/config/webui-origin.pem
              and its key at {{ state_dir }}/config/webui-origin.key

    - name: check that docker is installed
      ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      changed_when: false
      when: wp is defined

    - name: make the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ state_dir }}"
        - "{{ state_dir }}/data"
        - "{{ state_dir }}/config"
      when: wp is defined

    - name: set up the status page
      when: wp is defined and status_enabled
      block:
        - name: make the status directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0750"
          loop:
            - "{{ status_dir }}"
            - "{{ status_dir }}/www"

        - name: install the status page generator
          ansible.builtin.copy:
            src: status/lanlord-status.sh
            dest: "{{ status_dir }}/lanlord-status.sh"
            mode: "0750"

        # read by the generator as plain key=value lines
        - name: write the status page settings
          ansible.builtin.copy:
            dest: "{{ status_dir }}/status.conf"
            mode: "0640"
            content: |
              interface={{ internal_interface }}
              ip={{ internal_ip }}
              leases={{ ('/opt/lanlord/dns/' ~ lanlord_networks[0].name ~ '/dnsmasq.leases') if lanlord_networks | length > 0 else '/opt/lanlord/dns/dnsmasq.leases' }}
              zone={{ status_zone }}
              host={{ status_host }}
              {% for site in proxy_sites %}
              site={{ site.host }} {{ site.upstream }}
              {% endfor %}

        - name: install the status page units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            mode: "0640"
            content: "{{ item.content }}"
          loop:
            - name: lanlord-status.service
              content: |
                [Unit]
                Description=LANlord retronet status page

                [Service]
                Type=oneshot
                ExecStart={{ status_dir }}/lanlord-status.sh
            - name: lanlord-status.timer
              content: |
                [Unit]
                Description=Refresh the LANlord retronet status page

                [Timer]
                OnBootSec=10
                OnUnitActiveSec=30
                AccuracySec=1s

                [Install]
                WantedBy=timers.target

        - name: write the first status page
          ansible.builtin.command: "{{ status_dir }}/lanlord-status.sh"
          changed_when: false

        - name: start refreshing the status page
          ansible.builtin.systemd:
            name: lanlord-status.timer
            enabled: true
            state: started
            daemon_reload: true

    # lanlord webui runs as the unprivileged lanlord account with lanlord-web as its group, so
    # its own socket folder /run/lanlord-web and the socket belong to lanlord-web. that folder is
    # not /run/lanlord, which holds the decrypted settings during an apply. the proxy reaches the
    # socket as root (this module's caddy container, which gets only /run/lanlord-web mounted,
    # read-only) or as a member of lanlord-web (proxy_user, e.g. a caddy installed from a
    # package). lanlord-web gives nothing else. the folder survives restarts so the container's
    # mount never points at a removed folder.
    - name: run lanlord webui
      when: wp is defined and webui_on and webui_socket != ''
      block:
        - name: make the web ui socket group
          ansible.builtin.group:
            name: lanlord-web
            gid: 9990
            system: true

        - name: look for the proxy account
          ansible.builtin.command: getent passwd {{ webui_proxy_user }}
          register: proxy_account
          changed_when: false
          failed_when: false
          when: webui_proxy_user != 'root'

        # never create the account: a typo would otherwise make a new user
        - name: insist that the proxy account exists
          ansible.builtin.assert:
            that: proxy_account.rc == 0
            fail_msg: >-
              web-proxy webui proxy_user {{ webui_proxy_user }} does not exist on this machine; set it to the account
              your proxy runs as (for example caddy), or leave it out for this module's caddy container
          when: webui_proxy_user != 'root'

        - name: let the proxy account reach the socket
          ansible.builtin.user:
            name: "{{ webui_proxy_user }}"
            groups: lanlord-web
            append: true
            create_home: false
          when: webui_proxy_user != 'root'
          register: proxy_member

        - name: say that the proxy needs a restart
          ansible.builtin.debug:
            msg: "{{ webui_proxy_user }} is now in lanlord-web; restart its proxy so it picks up the group"
          when: proxy_member is changed

        - name: look for the lanlord binary
          ansible.builtin.stat:
            path: /opt/lanlord/bin/lanlord
          register: lanlord_bin

        # the web ui is sandboxed (no network, no privileges), so the operations it forwards are
        # run by a root service on its own socket. only the lanlord account is in the socket's
        # group, and the service checks the connecting uid as well.
        #
        # a second socket, local.sock, serves the accounts of the gateway itself (the terminal UI
        # and desktop window run there, signed in as the account using them). it is connectable
        # by anyone, in a folder anyone can search, because the kernel's word on who connected
        # decides: the service drops any peer that is not an ordinary login account (uid 1000 up)
        # and serves the rest as the account their uid belongs to, never as one they name. that
        # needs no group to keep in step with the logins. the web socket stays 0660 in the group.
        - name: make the operations socket group
          ansible.builtin.group:
            name: lanlord-operations
            gid: 9991
            system: true

        - name: let the web ui account reach the operations socket
          ansible.builtin.user:
            name: lanlord
            groups: lanlord-operations
            append: true
            create_home: false
          register: operations_member

        - name: look up the web ui account
          ansible.builtin.getent:
            database: passwd
            key: lanlord

        - name: install the operations service
          ansible.builtin.copy:
            dest: /etc/systemd/system/lanlord-operations.service
            mode: "0644"
            content: |
              [Unit]
              Description=LANlord operations service (runs what the web UI forwards)
              After=network.target

              [Service]
              User=root
              Group=lanlord-operations
              ExecStart=/opt/lanlord/bin/lanlord operations-service --socket /run/lanlord-operations/operations.sock --local-socket /run/lanlord-operations/local.sock --allowed-uid {{ getent_passwd['lanlord'][1] }} --identity /var/lib/lanlord-operations/identity
              # its own writable state (0700 root): the gateway's settings key (made on first start,
              # root only) goes here, and what apply and
              # ansible write goes under it
              StateDirectory=lanlord-operations
              StateDirectoryMode=0700
              Environment=HOME=/var/lib/lanlord-operations
              Environment=ANSIBLE_HOME=/var/lib/lanlord-operations/.ansible
              Environment=ANSIBLE_LOCAL_TEMP=/var/lib/lanlord-operations/.ansible/tmp
              RuntimeDirectory=lanlord-operations
              # searchable by all so login accounts reach local.sock; operations.sock is 0660 in
              # the group, so the folder's mode does not open it
              RuntimeDirectoryMode=0755
              RuntimeDirectoryPreserve=yes
              UMask=0007
              Restart=on-failure
              # it runs as root and runs sudo and setuid tools, so no NoNewPrivileges and no
              # capability bounding; home folders stay writable (creating a user's home and its
              # authorized_keys) and kernel modules loadable (apply loads them); the rest is closed
              ProtectHome=no
              PrivateTmp=yes
              ProtectKernelLogs=yes
              ProtectClock=yes
              ProtectHostname=yes
              RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
              RestrictNamespaces=yes
              RestrictRealtime=yes
              LockPersonality=yes
              SystemCallArchitectures=native

              [Install]
              WantedBy=multi-user.target
          register: operations_unit

        - name: start the operations service
          ansible.builtin.systemd:
            name: lanlord-operations.service
            enabled: true
            state: "{{ 'restarted' if operations_unit is changed else 'started' }}"
            daemon_reload: true
          when: lanlord_bin.stat.exists

        - name: install the web ui service
          ansible.builtin.copy:
            dest: /etc/systemd/system/lanlord-webui.service
            mode: "0644"
            content: |
              [Unit]
              Description=LANlord web UI
              After=network.target

              [Service]
              User=lanlord
              Group=lanlord-web
              # /opt/lanlord (the binary and the web build) is root:lanlord 0750
              SupplementaryGroups=lanlord
              ExecStart=/opt/lanlord/bin/lanlord webui --socket {{ webui_socket }}
              RuntimeDirectory=lanlord-web
              RuntimeDirectoryMode=0750
              RuntimeDirectoryPreserve=yes
              UMask=0007
              Restart=on-failure
              NoNewPrivileges=yes
              CapabilityBoundingSet=
              ProtectSystem=strict
              ProtectHome=yes
              PrivateTmp=yes
              PrivateDevices=yes
              PrivateNetwork=yes
              ProtectKernelTunables=yes
              ProtectKernelModules=yes
              ProtectKernelLogs=yes
              ProtectControlGroups=yes
              ProtectClock=yes
              ProtectHostname=yes
              ProtectProc=invisible
              RestrictAddressFamilies=AF_UNIX
              RestrictNamespaces=yes
              RestrictRealtime=yes
              RestrictSUIDSGID=yes
              LockPersonality=yes
              MemoryDenyWriteExecute=yes
              SystemCallArchitectures=native
              SystemCallFilter=@system-service

              [Install]
              WantedBy=multi-user.target
          register: webui_unit

        - name: start the web ui
          ansible.builtin.systemd:
            name: lanlord-webui.service
            enabled: true
            # a group added to lanlord is only picked up when the service starts
            state: "{{ 'restarted' if webui_unit is changed or operations_member is changed else 'started' }}"
            daemon_reload: true
          when: lanlord_bin.stat.exists

        - name: say where the binary goes
          ansible.builtin.debug:
            msg: "the web ui service is installed but waits for the lanlord binary at /opt/lanlord/bin/lanlord"
          when: not lanlord_bin.stat.exists

    - name: write the caddyfile
      ansible.builtin.template:
        src: web-proxy/Caddyfile.j2
        dest: "{{ state_dir }}/Caddyfile"
        mode: "0640"
      register: caddyfile
      when: wp is defined

    - name: check the caddyfile with caddy itself
      ansible.builtin.command: >-
        docker run --rm -v {{ state_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro {{ image }}
        caddy validate --config /etc/caddy/Caddyfile
      changed_when: false
      when: wp is defined

    - name: see whether the container is running
      ansible.builtin.command: "docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' {{ container }}"
      register: running
      changed_when: false
      failed_when: false
      when: wp is defined

    - name: replace the container when it is new, stopped or has a new caddyfile
      when: wp is defined and (running.stdout != 'true' or caddyfile is changed)
      block:
        - name: replace the container, keeping the old one until the new one is healthy
          ansible.builtin.include_tasks: replace-container.yml
          vars:
            rc_name: "{{ container }}"
            rc_health: "test \"$(docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' {{ container }})\" = true"
            rc_run: >-
              docker run -d --name {{ container }} --network host --restart unless-stopped
              -v {{ state_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro
              -v {{ state_dir }}/data:/data
              -v {{ state_dir }}/config:/config
              {{ '-v ' ~ status_dir ~ '/www:/srv/status:ro' if status_enabled else '' }}
              {{ '-v /run/lanlord-web:/run/lanlord-web:ro' if webui_on and webui_socket != '' else '' }}
              {{ image }}

    - name: wait for caddy to be up
      ansible.builtin.command: "docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' {{ container }}"
      register: caddy_up
      until: caddy_up.stdout == 'true'
      retries: 10
      delay: 1
      changed_when: false
      when: wp is defined

    - name: report
      ansible.builtin.debug:
        msg: >-
          caddy is proxying {{ proxy_sites | map(attribute='host') | list }} on {{ proxy_listen | join(', ') }}
          ({{ 'plain http' if proxy_tls == 'off' else 'https with its own certificate authority' }})
          {{- (', and the web ui at https://' ~ webui_host ~ ':' ~ webui_port ~ ' (' ~ webui_tls ~ ')') if webui_on else '' }}
      when: wp is defined
