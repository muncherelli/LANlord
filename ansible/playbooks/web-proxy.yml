# the web-proxy module: caddy in docker on the host network, proxying web
# requests to sites on the internal network and, once it exists, to the lanlord
# web interface. the docker module must have been applied first. it does
# nothing until your settings have a `web-proxy:` section.
#
# web-proxy:
#   listen: [host, internal]      # where caddy answers (the default is both): host is your normal network,
#                                 # internal (the retro network), or ipv4 addresses; a list or one value
#   tls: "off"                    # or internal, for https with caddy's own certificate authority (quote off)
#   sites:
#     - host: nostalgia.lan       # the name clients ask for
#       upstream: 172.16.120.20:80
#   webui:                        # the lanlord web interface, optional
#     host: lanlord.lan
#     upstream: 127.0.0.1:8787
#   status:                       # the retronet status page on the internal address, optional
#     enabled: true               # on by default
#     host: lanlord.retronet      # default: lanlord.<dns.zone>, or lanlord.retronet without the dns module
- name: lanlord web proxy
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [web-proxy]
  vars:
    image: caddy:2-alpine
    container: lanlord-caddy
    state_dir: /opt/lanlord/caddy
    status_dir: /opt/lanlord/status
  tasks:
    # a hyphenated name cannot be written as a variable, so look it up
    - name: read the web-proxy settings
      ansible.builtin.set_fact:
        wp: "{{ lookup('ansible.builtin.vars', 'web-proxy') }}"
      when: "lookup('ansible.builtin.varnames', '^web-proxy$', wantlist=True) | length > 0"

    - name: work out the host and internal network interfaces
      ansible.builtin.include_tasks: network.yml
      when: wp is defined

    - name: work out the defaults
      ansible.builtin.set_fact:
        proxy_listen_raw: "{{ wp.listen | default(['host', 'internal']) }}"
        # yaml reads an unquoted `off` as the boolean false, so accept both
        proxy_tls: "{{ 'off' if (wp.tls | default('off')) in ['off', false] else wp.tls }}"
        proxy_sites: >-
          {{ (wp.sites | default([]))
             + ([wp.webui] if wp.webui is defined else []) }}
        status_enabled: "{{ (wp.status | default({})).enabled | default(true) }}"
        status_zone: "{{ (dns | default({})).zone | default('retronet') }}"
      when: wp is defined

    - name: turn the listen setting into addresses
      ansible.builtin.set_fact:
        proxy_listen: >-
          {{ ([proxy_listen_raw] if proxy_listen_raw is string else proxy_listen_raw)
             | map('replace', 'host', host_address) | map('replace', 'internal', internal_ip) | unique | list }}
      when: wp is defined

    - name: work out the status page host
      ansible.builtin.set_fact:
        status_host: "{{ (wp.status | default({})).host | default('lanlord.' ~ status_zone) }}"
      when: wp is defined

    # these values end up in the caddyfile, so only plain names and addresses are accepted
    - name: check the settings
      ansible.builtin.assert:
        that:
          - proxy_listen | length > 0
          - proxy_listen | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == proxy_listen | length
          - proxy_tls in ['off', 'internal']
          - proxy_sites | length > 0
          - proxy_sites | map(attribute='host') | list | length == proxy_sites | map(attribute='host') | list | unique | length
          - proxy_sites | map(attribute='host') | select('match', '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$') | list | length == proxy_sites | length
          - proxy_sites | map(attribute='upstream') | select('match', '^(https?://)?[A-Za-z0-9.-]+:[0-9]{1,5}$') | list | length == proxy_sites | length
          - status_enabled is boolean
          - status_host is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$')
          - status_zone is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$')
          - not status_enabled or status_host not in (proxy_sites | map(attribute='host') | list)
          - not status_enabled or (internal_ip | default('')) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: >-
          web-proxy settings: listen is host, internal or ipv4 addresses (and the interface needs one), tls is off or internal, and every site
          (and webui) has a unique host name like nostalgia.lan and an upstream like 172.16.120.20:80,
          and status has a boolean enabled and a host name that no site uses (the internal interface needs an address)
      when: wp is defined

    - name: check that docker is installed
      ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      changed_when: false
      when: wp is defined

    - name: make the state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ state_dir }}"
        - "{{ state_dir }}/data"
        - "{{ state_dir }}/config"
      when: wp is defined

    - name: set up the status page
      when: wp is defined and status_enabled
      block:
        - name: make the status directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0750"
          loop:
            - "{{ status_dir }}"
            - "{{ status_dir }}/www"

        - name: install the status page generator
          ansible.builtin.copy:
            src: status/lanlord-status.sh
            dest: "{{ status_dir }}/lanlord-status.sh"
            mode: "0750"

        # read by the generator as plain key=value lines
        - name: write the status page settings
          ansible.builtin.copy:
            dest: "{{ status_dir }}/status.conf"
            mode: "0640"
            content: |
              interface={{ internal_interface }}
              ip={{ internal_ip }}
              zone={{ status_zone }}
              host={{ status_host }}
              {% for site in proxy_sites %}
              site={{ site.host }} {{ site.upstream }}
              {% endfor %}

        - name: install the status page units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            mode: "0640"
            content: "{{ item.content }}"
          loop:
            - name: lanlord-status.service
              content: |
                [Unit]
                Description=LANlord retronet status page

                [Service]
                Type=oneshot
                ExecStart={{ status_dir }}/lanlord-status.sh
            - name: lanlord-status.timer
              content: |
                [Unit]
                Description=Refresh the LANlord retronet status page

                [Timer]
                OnBootSec=10
                OnUnitActiveSec=30
                AccuracySec=1s

                [Install]
                WantedBy=timers.target

        - name: write the first status page
          ansible.builtin.command: "{{ status_dir }}/lanlord-status.sh"
          changed_when: false

        - name: start refreshing the status page
          ansible.builtin.systemd:
            name: lanlord-status.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: write the caddyfile
      ansible.builtin.template:
        src: web-proxy/Caddyfile.j2
        dest: "{{ state_dir }}/Caddyfile"
        mode: "0640"
      register: caddyfile
      when: wp is defined

    - name: check the caddyfile with caddy itself
      ansible.builtin.command: >-
        docker run --rm -v {{ state_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro {{ image }}
        caddy validate --config /etc/caddy/Caddyfile
      changed_when: false
      when: wp is defined

    - name: see whether the container is running
      ansible.builtin.command: "docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' {{ container }}"
      register: running
      changed_when: false
      failed_when: false
      when: wp is defined

    - name: replace the container when it is new, stopped or has a new caddyfile
      when: wp is defined and (running.stdout != 'true' or caddyfile is changed)
      block:
        - name: remove the old container
          ansible.builtin.command: "docker rm -f {{ container }}"
          changed_when: true
          failed_when: false

        - name: start caddy on the host network
          ansible.builtin.command: >-
            docker run -d --name {{ container }} --network host --restart unless-stopped
            -v {{ state_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro
            -v {{ state_dir }}/data:/data
            -v {{ state_dir }}/config:/config
            {{ '-v ' ~ status_dir ~ '/www:/srv/status:ro' if status_enabled else '' }}
            {{ image }}
          changed_when: true

    - name: wait for caddy to be up
      ansible.builtin.command: "docker inspect --format '{% raw %}{{.State.Running}}{% endraw %}' {{ container }}"
      register: caddy_up
      until: caddy_up.stdout == 'true'
      retries: 10
      delay: 1
      changed_when: false
      when: wp is defined

    - name: report
      ansible.builtin.debug:
        msg: >-
          caddy is proxying {{ proxy_sites | map(attribute='host') | list }} on {{ proxy_listen | join(', ') }}
          ({{ 'plain http' if proxy_tls == 'off' else 'https with its own certificate authority' }})
      when: wp is defined
