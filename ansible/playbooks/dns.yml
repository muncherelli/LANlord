# the dns module: one dnsmasq in docker for every lanlord network, each on the host network but
# pinned to its own interface and address, answering local-only dns and gatewayless dhcp there.
# a dnsmasq never resolves names outside its zone. the docker module must have been applied first.
# the networks are in your settings (see networks.yml); settings with only a `dns:` section still
# work, as one network called retronet. it does nothing without either.
#
# the dns settings of one network, in its entry under `networks:` (or in the `dns:` section):
#
#   zone: retronet                # a plain label like a tld; default: the network's name
#   records:                      # extra names in the zone
#     - {name: ntsrv1, address: 172.16.120.10}
#   dhcp:                         # optional; no dhcp server without it
#     range: [172.16.120.100, 172.16.120.200]
#     lease: 7d                   # 30m, 12h, 7d or infinite; default 7d
#     hosts:                      # static leases by mac
#       - {name: ntsrv1, mac: "aa:bb:cc:dd:ee:ff", address: 172.16.120.10}
#
# lanlord.<zone>, the gateway's hostname, the nt4-domain netbios name and the web-proxy hosts
# ending in .<zone> all point at the network's address. each network has its own container,
# lanlord-dns-<name>, and its own folder, /opt/lanlord/dns/<name>, with the leases in
# dnsmasq.leases. a network that is taken out of the settings has its container and folder removed.
- name: lanlord dns
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tags: [dns]
  vars:
    image: lanlord-dns
    image_dir: /opt/lanlord/playbooks/dns/image
    state_root: /opt/lanlord/dns
    label_re: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
  tasks:
    - name: work out the lanlord networks
      ansible.builtin.include_tasks: networks.yml
      when: dns is defined or networks is defined

    - name: work out which networks get a dnsmasq and the names they answer for
      ansible.builtin.include_tasks: dns-facts.yml

    - name: check that docker is installed
      ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      changed_when: false
      when: dns_networks | length > 0

    - name: make the state directory
      ansible.builtin.file:
        path: "{{ state_root }}"
        state: directory
        mode: "0750"
      when: dns_networks | length > 0

    - name: work out the image tag from the files it is built from
      ansible.builtin.shell: cat Dockerfile | sha256sum | cut -c1-12
      args:
        chdir: "{{ image_dir }}"
      register: image_hash
      changed_when: false
      when: dns_networks | length > 0

    - name: see whether the image is built
      ansible.builtin.command: "docker image inspect {{ image }}:{{ image_hash.stdout }}"
      register: image_present
      changed_when: false
      failed_when: false
      when: dns_networks | length > 0

    - name: build the image here
      ansible.builtin.command: "docker build --quiet -t {{ image }}:{{ image_hash.stdout }} {{ image_dir }}"
      changed_when: true
      when: dns_networks | length > 0 and image_present.rc != 0

    - name: move a single dnsmasq from before there was one per network
      ansible.builtin.include_tasks: dns-migrate.yml
      when: dns_networks | length > 0

    - name: set up a dnsmasq for every network
      ansible.builtin.include_tasks: dns-network.yml
      loop: "{{ dns_networks }}"
      loop_control:
        loop_var: net
        label: "{{ net.name }}"

    - name: remove the dnsmasq of networks that are gone
      ansible.builtin.include_tasks: dns-cleanup.yml
      when: networks is defined

    - name: report
      ansible.builtin.debug:
        msg: >-
          {{ dns_networks | length }} dnsmasq: {{ dns_networks | map(attribute='name') | join(', ') }}
      when: dns_networks | length > 0
