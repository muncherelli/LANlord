name: image

# publishes ghcr.io/muncherelli/lanlord/lanlord-server-component, one tag per component:
#   nt4 (rolling) and nt4-<samba version> (immutable)
#   network-services (rolling) and network-services-<dnsmasq version>
# the images hold only upstream software; lanlord's scripts and config are mounted by the
# playbooks, so a rolling tag stays compatible with older lanlord installs. to add a version,
# add a line to .github/image-versions.json; `latest: true` marks the one the rolling tag
# points at (it is re-pointed on every run).
#
# a versioned tag is never overwritten: when it already exists the publish job skips its
# build. the rolling tag is always re-pointed at the versioned tag marked latest, so it cannot
# get stuck. to deliberately reissue one (a fixed Dockerfile, a newer alpine), add a line with
# the same `version` and a `tag` ending in -r2 (then -r3, ...) and move `latest: true` to it.
# pull requests only build, and the publish job, the only one with packages: write, runs on
# pushes alone.
on:
  push:
    branches: [trunk]
    tags: ['v*']
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
      - .github/image-versions.json
  pull_request:
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
      - .github/image-versions.json
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/muncherelli/lanlord/lanlord-server-component

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: echo "matrix={\"include\":$(jq -c . .github/image-versions.json)}" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name == 'pull_request'
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # only proves that the image builds for both architectures
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.arg }}=${{ matrix.version }}

  publish:
    if: github.event_name != 'pull_request'
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      VERSIONED: ghcr.io/muncherelli/lanlord/lanlord-server-component:${{ matrix.component }}-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # only a "not found" answer means the tag is free; any other error (auth, registry) fails the job
      - name: see whether the versioned tag is already published
        id: exists
        run: |
          if out=$(docker buildx imagetools inspect "$VERSIONED" 2>&1); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$VERSIONED is already published; leaving it alone"
          elif grep -qiE 'not found|manifest unknown|name unknown' <<<"$out"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.exists.outputs.found == 'false'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.arg }}=${{ matrix.version }}
          tags: ${{ env.VERSIONED }}
      # the rolling tag always points at the versioned tag marked latest (idempotent, keeps every arch)
      - name: point the rolling tag at it
        if: matrix.latest
        run: docker buildx imagetools create -t "ghcr.io/muncherelli/lanlord/lanlord-server-component:${{ matrix.component }}" "$VERSIONED"
