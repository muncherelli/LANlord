name: image

# publishes ghcr.io/muncherelli/lanlord/lanlord-server-component, one tag per component:
#   nt4 (rolling) and nt4-<samba version> (immutable)
#   network-services (rolling) and network-services-<dnsmasq version>
# the images hold only upstream software; lanlord's scripts and config are mounted by the
# playbooks, so a rolling tag stays compatible with older lanlord installs. to add a version,
# add a line to the matrix; `latest: true` marks the one the rolling tag follows.
#
# a versioned tag is never overwritten: when it already exists the publish job skips it, and the
# rolling tag only moves when a new versioned tag is published. to deliberately reissue one (a
# fixed Dockerfile, a newer alpine), add a matrix line with the same `version` and a `tag` ending
# in -r2 (then -r3, ...) and move `latest: true` to it. pull requests only build, and the
# publish job, the only one with packages: write, runs on pushes alone.
on:
  push:
    branches: [trunk]
    tags: ['v*']
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
  pull_request:
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/muncherelli/lanlord/lanlord-server-component

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: nt4
            version: 4.22.11
            tag: 4.22.11
            latest: true
            context: ansible/playbooks/nt4-domain/image
            arg: SAMBA_VERSION
          - component: network-services
            version: '2.91'
            tag: '2.91'
            latest: true
            context: ansible/playbooks/dns/image
            arg: DNSMASQ_VERSION
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # only proves that the image builds for both architectures
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.arg }}=${{ matrix.version }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: nt4
            version: 4.22.11
            tag: 4.22.11
            latest: true
            context: ansible/playbooks/nt4-domain/image
            arg: SAMBA_VERSION
          - component: network-services
            version: '2.91'
            tag: '2.91'
            latest: true
            context: ansible/playbooks/dns/image
            arg: DNSMASQ_VERSION
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: work out the tags, and whether the versioned one is already published
        id: tags
        run: |
          versioned="$IMAGE:${{ matrix.component }}-${{ matrix.tag }}"
          if docker buildx imagetools inspect "$versioned" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$versioned is already published; leaving it alone"
          else
            {
              echo "exists=false"
              echo "list<<EOF"
              echo "$versioned"
              if [ "${{ matrix.latest }}" = true ]; then echo "$IMAGE:${{ matrix.component }}"; fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.tags.outputs.exists == 'false'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.arg }}=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.list }}
