name: image

# publishes two images, one package each, versioned independently:
#   ghcr.io/muncherelli/lanlord-nt4-server-components  samba built from source
#   ghcr.io/muncherelli/lanlord-dhcp-dns-components  dnsmasq on alpine
# each image owns a directory (see .github/images.json) with its Dockerfile and a VERSION
# file holding X.Y.Z. the images hold only upstream software; lanlord's scripts and config
# are mounted by the playbooks. the upstream versions (samba, dnsmasq) are not tags: they
# are labels (org.opencontainers.image.version is the image's X.Y.Z, io.lanlord.samba.version
# and io.lanlord.dnsmasq.version the upstream ones), set from the ARG in the Dockerfile.
#
# an image is only touched when it changed:
# - the `versions` job lists the images whose input files (images.json) changed, by a git diff
#   against the base branch (pull requests). a push to trunk considers every image, because
#   runs are queued one at a time and an earlier push may have been cancelled; the packages
#   check skips whatever is published already. a manual run takes an `image` input instead.
# - a pull request builds those images for amd64 and arm64 without pushing, and fails when an
#   image changed but its VERSION was not raised above the base branch's, so a change cannot
#   ship without a new version.
# - a push to trunk publishes an image only when its X.Y.Z tag does not exist in ghcr yet; when
#   it does, the image is skipped whole: no build, no push, rolling tags untouched. a published
#   X.Y.Z is never overwritten.
# - publishing only happens on trunk (also for a manual run), one run per ref at a time. the merge
#   step checks again that X.Y.Z is still free, and moves the rolling X.Y, X and latest tags to
#   it only when it is the newest version in their range. forks never publish.
# each architecture is built natively (amd64 and arm64 runners, no qemu) and the two are merged
# into one multi-arch tag.
# release tags (release-plz) do not run this workflow, so a lanlord release rebuilds nothing.
on:
  push:
    branches: [trunk]
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
      - .github/images.json
  pull_request:
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - .github/workflows/image.yml
      - .github/images.json
  workflow_dispatch:
    inputs:
      image:
        description: image to publish (a version that is already published is still never overwritten)
        type: choice
        options: [all, nt4-server-components, dhcp-dns-components]
        default: all

permissions:
  contents: read

# one run per ref at a time, never cancelled half way through a publish
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      images: ${{ steps.read.outputs.images }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          PICK: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base=""
          case "$EVENT" in
            pull_request) base="$BASE" ;;
            # an all-zero "before" (a new branch) has no base: every image counts as changed
            push) case "$BEFORE" in *[!0]*) base="$BEFORE" ;; *) base="" ;; esac ;;
            workflow_dispatch) ;;
            *) echo "unknown event $EVENT" >&2; exit 1 ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          changed=""
          [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD)
          include='[]'
          failed=0
          while read -r entry; do
            name=$(jq -r .name <<<"$entry"); dir=$(jq -r .dir <<<"$entry")
            hit=0
            if [ "$EVENT" = workflow_dispatch ]; then
              if [ "$PICK" = all ] || [ "$PICK" = "$name" ]; then hit=1; fi
            elif [ -z "$base" ] || [ "$EVENT" = push ]; then
              # a push counts every image as changed: the concurrency group keeps one pending run, so
              # an earlier push may have been cancelled, and the packages check below skips what is published
              hit=1
            else
              for f in $(jq -r '.inputs[]' <<<"$entry"); do
                if grep -qxF "$dir/$f" <<<"$changed"; then hit=1; fi
              done
            fi
            [ "$hit" = 1 ] || continue
            version=$(tr -d '[:space:]' < "$dir/VERSION")
            if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$version"; then
              echo "::error file=$dir/VERSION::$name: VERSION must be X.Y.Z, found '$version'"; failed=1; continue
            fi
            if [ "$EVENT" = pull_request ]; then
              old=$(git show "$base:$dir/VERSION" 2>/dev/null | tr -d '[:space:]' || true)
              if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "$old" "$version" | sort -V | tail -n1)" != "$version" -o "$old" = "$version" ]; then
                echo "::error file=$dir/VERSION::$name changed, so $dir/VERSION must be raised above $old (it is $version)"; failed=1
              fi
            fi
            if [ "$EVENT" != pull_request ]; then
              # the tags of the package; a 404 means the package does not exist yet, so the version is free.
              # any other error (auth, registry) fails the job. a published version is skipped whole:
              # no build, no push, rolling tags untouched
              image=$(jq -r .image <<<"$entry")
              if out=$(gh api --paginate "/users/muncherelli/packages/container/$image/versions" -q '.[].metadata.container.tags[]' 2>&1); then
                if grep -qxF "$version" <<<"$out"; then echo "$image:$version is already published; skipping $name"; continue; fi
              elif ! grep -q 'HTTP 404' <<<"$out"; then
                echo "$out" >&2; exit 1
              fi
            fi
            include=$(jq -c --arg v "$version" --argjson e "$entry" '. + [$e + {version: $v}]' <<<"$include")
          done < <(jq -c '.[]' .github/images.json)
          [ "$failed" = 0 ] || exit 1
          # one job per image and architecture, each on a native runner
          arch='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          expanded=$(jq -c --argjson a "$arch" '[.[] as $e | $a[] | $e + .]' <<<"$include")
          echo "matrix={\"include\":$expanded}" >> "$GITHUB_OUTPUT"
          echo "images={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$include")" >> "$GITHUB_OUTPUT"
          echo "images to handle: $(jq -c '[.[].name]' <<<"$include")"

  build:
    if: github.event_name == 'pull_request' && needs.versions.outputs.any == 'true'
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # only proves that the image builds on this architecture
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ matrix.platform }}
          push: false
          build-args: IMAGE_VERSION=${{ matrix.version }}

  # one job per image and architecture; the images in the matrix are all unpublished versions
  publish:
    if: github.repository_owner == 'muncherelli' && github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request' && needs.versions.outputs.any == 'true'
    needs: versions
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      REPO: ghcr.io/muncherelli/${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # pushed by digest only: no tag exists until the merge job has both architectures
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ matrix.platform }}
          build-args: IMAGE_VERSION=${{ matrix.version }}
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # one multi-arch tag per image. it runs for an image even when another image failed, but fails
  # clearly (and tags nothing) when one of this image's architectures is missing. the rolling tags
  # are created first and the immutable X.Y.Z last, so a published X.Y.Z always means a finished run.
  merge:
    if: ${{ !cancelled() && github.repository_owner == 'muncherelli' && github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request' && needs.versions.outputs.any == 'true' }}
    needs: [versions, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.images) }}
    env:
      REPO: ghcr.io/muncherelli/${{ matrix.image }}
      VERSION: ${{ matrix.version }}
      IMAGE: ${{ matrix.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: tag the merged image
        run: |
          set -eu
          # both architectures must have been built
          [ -d /tmp/digests ] && [ "$(ls /tmp/digests | wc -l)" = 2 ] || { echo "$IMAGE is missing a built architecture; nothing was tagged" >&2; exit 1; }
          # look at the tags again right before tagging: an immutable X.Y.Z is never overwritten
          if out=$(gh api --paginate "/users/muncherelli/packages/container/$IMAGE/versions" -q '.[].metadata.container.tags[]' 2>&1); then
            tags="$out"
          elif grep -q 'HTTP 404' <<<"$out"; then
            tags=""
          else
            echo "$out" >&2; exit 1
          fi
          if grep -qxF "$VERSION" <<<"$tags"; then echo "$REPO:$VERSION appeared meanwhile; leaving it alone"; exit 0; fi
          minor=${VERSION%.*}; major=${VERSION%%.*}
          # a rolling tag only moves to this version when nothing newer exists in its range
          newest() { local pattern=$1; printf '%s\n' "$VERSION" $(grep -E "$pattern" <<<"$tags" || true) | sort -V | tail -n1; }
          args=""
          [ "$(newest '^[0-9]+\.[0-9]+\.[0-9]+$')" = "$VERSION" ] && args="$args -t $REPO:latest"
          [ "$(newest "^$major\\.[0-9]+\\.[0-9]+$")" = "$VERSION" ] && args="$args -t $REPO:$major"
          [ "$(newest "^$major\\.${minor#*.}\\.[0-9]+$")" = "$VERSION" ] && args="$args -t $REPO:$minor"
          cd /tmp/digests
          digests=$(printf "$REPO@sha256:%s " *)
          # the rolling tags first, then X.Y.Z on its own: a run that fails half way never leaves X.Y.Z
          # published, so a retry is not skipped
          # shellcheck disable=SC2086
          [ -z "$args" ] || docker buildx imagetools create $args $digests
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$REPO:$VERSION" $digests
