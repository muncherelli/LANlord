name: image

# publishes three images, one package each, tagged with a lanlord version (X.Y.Z):
#   ghcr.io/muncherelli/lanlord-nt4-server-components  samba built from source
#   ghcr.io/muncherelli/lanlord-network-server-components  dnsmasq on alpine
#   ghcr.io/muncherelli/lanlord-time-server-components  chrony on alpine
# each image owns a directory (see .github/images.json) with its Dockerfile. the images hold only
# upstream software; lanlord's scripts and config are mounted by the playbooks. the upstream
# versions (samba, dnsmasq) are not tags: they are labels (org.opencontainers.image.version is the
# lanlord version, io.lanlord.samba.version, io.lanlord.dnsmasq.version and io.lanlord.chrony.version the upstream ones), set
# from the ARG in the Dockerfile.
#
# the version is the one in development, from tools/image-version.sh: the next patch after the
# latest v* release tag (or the workspace version when that is ahead). lanlord builds work out the
# same version (crates/core/build.rs) and the playbooks pin it, so a build uses the images of its
# own version.
# - a push to trunk that changes image files (or a manual run without a `tag`) builds and publishes
#   the images of the development version, overwriting that X.Y.Z while v<X.Y.Z> is not released.
#   once v<X.Y.Z> exists its images are frozen: never rebuilt or overwritten, and the next publish
#   goes to the next version.
# - release-plz dispatches this workflow with the release tag (tags pushed with the default token
#   start no workflows), as does a manual run with a `tag` input (like v0.1.0). this makes sure the
#   released X.Y.Z exists for every image, and never overwrites one: when it is missing, the newest
#   older version's manifest is retagged (no rebuild, the image files did not change in the cycle),
#   or the image is built from the sources at the tag when there is no older version.
# - a pull request that touches image files builds those images for amd64 and arm64 without pushing.
# - every image records the commit it was built from (org.opencontainers.image.revision). a tag counts
#   as published only when its image has that label and a version label equal to the tag (an image
#   of the old per-image version scheme does not, so it is overwritten). a release keeps an existing
#   X.Y.Z, or retags an older version, only when the image inputs are the same at that revision and at
#   the release tag; otherwise it builds from the tag.
# - the rolling X.Y, X and latest tags move only on a release, and only to a version that is the newest
#   in their range. development builds publish just their exact X.Y.Z, which is what the playbooks pin.
#   publishing only happens from trunk's copy of this workflow; forks never publish.
# each architecture is built natively (amd64 and arm64 runners, no qemu) and the two are merged
# into one multi-arch tag.
on:
  push:
    branches: [trunk]
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - ansible/playbooks/time/image/**
      - .github/workflows/image.yml
      - tools/test-nt4-join.sh
      - ansible/tests/test_nt4_exec.py
      - .github/images.json
  pull_request:
    paths:
      - ansible/playbooks/nt4-domain/image/**
      - ansible/playbooks/dns/image/**
      - ansible/playbooks/time/image/**
      - .github/workflows/image.yml
      - tools/test-nt4-join.sh
      - ansible/tests/test_nt4_exec.py
      - .github/images.json
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to make sure is published (like v0.2.0); empty publishes the development version
        required: false
        default: ""
      image:
        description: image to handle
        type: choice
        options: [all, nt4-server-components, network-server-components, time-server-components]
        default: all

permissions:
  contents: read

# one run per ref at a time, never cancelled half way through a publish
concurrency:
  group: image-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      images: ${{ steps.read.outputs.images }}
      builds: ${{ steps.read.outputs.builds }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          PICK: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base=""
          mode=dev
          case "$EVENT" in
            pull_request) mode="pr"; base="$BASE" ;;
            # an all-zero "before" (a new branch) has no base: every image counts as changed
            push) case "$BEFORE" in *[!0]*) base="$BEFORE" ;; *) base="" ;; esac ;;
            workflow_dispatch)
              if [ -n "$TAG" ]; then
                grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$TAG" || { echo "::error::tag must be vX.Y.Z, found '$TAG'"; exit 1; }
                mode=release
              fi ;;
            *) echo "unknown event $EVENT" >&2; exit 1 ;;
          esac
          if [ "$mode" = release ]; then
            version=${TAG#v}
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG does not exist"; exit 1; }
          else
            version=$(tools/image-version.sh)
          fi
          echo "mode $mode, version $version"
          # a development version whose release exists is frozen: nothing is rebuilt or overwritten
          if [ "$mode" = dev ] && [ -n "$(git tag --list "v$version")" ]; then
            echo "::notice::v$version is released, so its images are frozen; nothing to publish"
            version=""
          fi
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          changed=""
          [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD)
          # true when the image inputs are the same in a commit and at the release tag
          unchanged() {
            local entry=$1 commit=$2 dir
            dir=$(jq -r .dir <<<"$entry")
            git cat-file -e "$commit^{commit}" 2>/dev/null || return 1
            # the inputs are separate words on purpose
            # shellcheck disable=SC2046
            git diff --quiet "$commit" "v$version" -- $(jq -r --arg d "$dir" '.inputs[] | $d + "/" + .' <<<"$entry")
          }
          include='[]'
          own=""
          if [ -n "$version" ]; then
            while read -r entry; do
              name=$(jq -r .name <<<"$entry"); dir=$(jq -r .dir <<<"$entry"); image=$(jq -r .image <<<"$entry")
              action=build; from=""; own=""
              if [ "$mode" = release ] || [ "$EVENT" = workflow_dispatch ]; then
                [ "$PICK" = all ] || [ "$PICK" = "$name" ] || continue
                # a release from before the image existed has nothing to publish
                if [ "$mode" = release ] && ! git cat-file -e "v$version:$dir" 2>/dev/null; then
                  echo "v$version has no $dir; skipping $name"; continue
                fi
              else
                hit=0
                if [ -z "$base" ]; then
                  hit=1
                else
                  for f in $(jq -r '.inputs[]' <<<"$entry"); do
                    if grep -qxF "$dir/$f" <<<"$changed"; then hit=1; fi
                  done
                fi
                [ "$hit" = 1 ] || [ "$mode" = pr ] || own=$(tools/ghcr-own-versions.sh "$image")
                # a push also catches up an image whose version was never published (an earlier run may
                # have been cancelled)
                if [ "$hit" = 0 ] && [ "$mode" = dev ] && ! grep -q "^$version " <<<"$own"; then hit=1; fi
                [ "$hit" = 1 ] || continue
              fi
              revision=$(git rev-parse HEAD)
              if [ "$mode" = release ]; then
                own=$(tools/ghcr-own-versions.sh "$image")
                revision=$(git rev-list -n1 "v$version")
                have=$(sed -n "s/^$version //p" <<<"$own")
                if [ -n "$have" ] && unchanged "$entry" "$have"; then echo "$image:$version is already published; skipping $name"; continue; fi
                # an older version whose image inputs equal the tag's is retagged, no rebuild; any change
                # since (or an unknown revision) builds from the tag
                # the version list is separate words on purpose
                # shellcheck disable=SC2046
                from=$(printf '%s\n' "$version" $(cut -d' ' -f1 <<<"$own") | sort -uV | sed "/^$version\$/,\$d" | tail -n1)
                if [ -n "$from" ]; then
                  frev=$(sed -n "s/^$from //p" <<<"$own")
                  if unchanged "$entry" "$frev"; then action=retag; revision=$frev; else from=""; fi
                fi
              fi
              include=$(jq -c --arg v "$version" --arg m "$mode" --arg a "$action" --arg f "$from" --arg r "$revision" --argjson e "$entry" '. + [$e + {version: $v, mode: $m, action: $a, from: $f, revision: $r}]' <<<"$include")
            done < <(jq -c '.[]' .github/images.json)
          fi
          # one job per image and architecture, each on a native runner; only builds need them
          arch='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          builds=$(jq -c '[.[] | select(.action == "build")]' <<<"$include")
          expanded=$(jq -c --argjson a "$arch" '[.[] as $e | $a[] | $e + .]' <<<"$builds")
          {
            echo "matrix={\"include\":$expanded}"
            echo "images={\"include\":$include}"
            echo "builds=$(jq 'length > 0' <<<"$builds")"
            echo "any=$(jq 'length > 0' <<<"$include")"
          } >> "$GITHUB_OUTPUT"
          echo "images to handle: $(jq -c '[.[] | {name, action, from}]' <<<"$include")"

  build:
    if: github.event_name == 'pull_request' && needs.versions.outputs.builds == 'true'
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # the samba build is long: the first build keeps its layers for the real build below
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: matrix.name == 'nt4-server-components' && matrix.arch == 'amd64'
        with:
          context: ${{ matrix.dir }}
          target: build
          load: true
          tags: nt4-build:test
          cache-from: type=gha,scope=nt4-amd64
          cache-to: type=gha,scope=nt4-amd64,mode=max
      # a nt4-style join (bare ntlmv1 smb1 logon, machine account password over samr) must work
      - name: nt4 join regression test
        if: matrix.name == 'nt4-server-components' && matrix.arch == 'amd64'
        run: docker run --rm -v "$PWD/tools/test-nt4-join.sh:/test-join.sh:ro" nt4-build:test sh /test-join.sh
      # only proves that the image builds on this architecture
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          cache-from: ${{ matrix.name == 'nt4-server-components' && matrix.arch == 'amd64' && 'type=gha,scope=nt4-amd64' || '' }}
          context: ${{ matrix.dir }}
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            IMAGE_REVISION=${{ matrix.revision }}

  # one job per image and architecture that needs a build
  # the exec script runs on busybox in the image, so its tests run on that busybox too: the stubs go first in
  # PATH and everything else (flock, stat, tail, head, tr, sha256sum...) is busybox. this is a job of its own
  # because the build job only runs when an image input changed, and the script is not one (it is mounted, not
  # baked in). the container is the alpine the images are built on (the pin in the Dockerfile, so it is the same
  # busybox) with bash and python3 added: the script needs bash and the tests need python3; no samba build
  # (--init: the tests orphan processes and check they are gone, so pid 1 must reap them)
  exec-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: exec script tests on busybox
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
            grep -qxE 'ansible/playbooks/nt4-domain/image/(lanlord-exec|Dockerfile)|ansible/tests/test_nt4_exec.py|\.github/workflows/image.yml'; then
            echo "::notice::the exec script, its tests and the nt4 image are unchanged"
            exit 0
          fi
          alpine=$(sed -n 's/^ARG ALPINE_IMAGE=//p' ansible/playbooks/nt4-domain/image/Dockerfile)
          docker run --rm --init -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/repo:ro" -w /repo "$alpine" \
            sh -c 'apk add --no-cache bash python3 >/dev/null && python3 -m unittest discover -s ansible/tests -p test_nt4_exec.py'

  publish:
    if: github.repository_owner == 'muncherelli' && github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request' && needs.versions.outputs.builds == 'true'
    needs: versions
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      REPO: ghcr.io/muncherelli/${{ matrix.image }}
    steps:
      # a release is built from the sources at its tag, a development version from trunk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # pushed by digest only: no tag moves until the merge job has both architectures
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ matrix.platform }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            IMAGE_REVISION=${{ matrix.revision }}
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # one multi-arch tag per image, from the built digests or (a release with nothing to rebuild) by
  # retagging an older version. it runs for an image even when another image failed, but fails clearly
  # (and tags nothing) when one of this image's architectures is missing. the rolling tags are
  # created first and X.Y.Z last, so a release's X.Y.Z always means a finished run.
  merge:
    if: ${{ !cancelled() && github.repository_owner == 'muncherelli' && github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request' && needs.versions.outputs.any == 'true' }}
    needs: [versions, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # one tagging at a time per image, whatever triggered it, so a dev and a release run cannot move
    # latest backwards (a run that waits is replaced by a newer waiting one)
    concurrency:
      group: image-merge-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.images) }}
    env:
      REPO: ghcr.io/muncherelli/${{ matrix.image }}
      VERSION: ${{ matrix.version }}
      MODE: ${{ matrix.mode }}
      ACTION: ${{ matrix.action }}
      FROM: ${{ matrix.from }}
      REVISION: ${{ matrix.revision }}
      IMAGE: ${{ matrix.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # only for tools/ghcr-own-versions.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.action == 'build'
        continue-on-error: true
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: tag the merged image
        run: |
          set -eu
          if [ "$ACTION" = build ]; then
            # both architectures must have been built
            [ -d /tmp/digests ] && [ "$(find /tmp/digests -mindepth 1 -maxdepth 1 | wc -l)" = 2 ] || { echo "$IMAGE is missing a built architecture; nothing was tagged" >&2; exit 1; }
          fi
          # look at the versions again right before tagging
          own=$(tools/ghcr-own-versions.sh "$IMAGE")
          if [ "$MODE" = release ]; then
            # the same content was published meanwhile (a repeated or concurrent run): leave it alone
            if [ "$(sed -n "s/^$VERSION //p" <<<"$own")" = "$REVISION" ]; then echo "$REPO:$VERSION appeared meanwhile; leaving it alone"; exit 0; fi
          else
            # a development version may be overwritten until its release exists. only 404 means it does not
            if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
              echo "v$VERSION was released meanwhile; leaving $REPO:$VERSION alone"; exit 0
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              echo "$out" >&2; exit 1
            fi
          fi
          # the rolling tags only move on a release, and only when nothing newer exists in their range
          # (old-scheme tags that are not ours do not count). development builds get just their X.Y.Z
          args=""
          if [ "$MODE" = release ]; then
            minor=${VERSION%.*}; major=${VERSION%%.*}
            tags=$(cut -d' ' -f1 <<<"$own")
            # the version list is separate words on purpose
            # shellcheck disable=SC2046
            newest() { local pattern=$1; printf '%s\n' "$VERSION" $(grep -E "$pattern" <<<"$tags" || true) | sort -V | tail -n1; }
            [ "$(newest '^[0-9]+\.[0-9]+\.[0-9]+$')" = "$VERSION" ] && args="$args -t $REPO:latest"
            [ "$(newest "^$major\\.[0-9]+\\.[0-9]+$")" = "$VERSION" ] && args="$args -t $REPO:$major"
            [ "$(newest "^$major\\.${minor#*.}\\.[0-9]+$")" = "$VERSION" ] && args="$args -t $REPO:$minor"
          fi
          if [ "$ACTION" = build ]; then
            cd /tmp/digests
            source=$(printf "$REPO@sha256:%s " *)
          else
            # the retag copies the whole multi-arch manifest, nothing is rebuilt
            source="$REPO:$FROM"
          fi
          # the rolling tags first, then X.Y.Z on its own
          # shellcheck disable=SC2086
          [ -z "$args" ] || docker buildx imagetools create $args $source
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$REPO:$VERSION" $source

  # a waiting merge can be replaced by a newer waiting run of the same image (see its concurrency
  # group), which would drop a release's tags. so a release run ends by checking that X.Y.Z is
  # there with the revision it should have, and fails loudly when not: run the workflow again by
  # hand with the same tag.
  verify:
    if: ${{ always() && github.repository_owner == 'muncherelli' && github.ref == 'refs/heads/trunk' && github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.versions.outputs.any == 'true' }}
    needs: [versions, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ matrix.version }}
      REVISION: ${{ matrix.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: check the released tag
        run: |
          set -euo pipefail
          # the packages api can lag a moment behind the push, so look a few times
          for attempt in 1 2 3 4 5; do
            have=$(tools/ghcr-own-versions.sh "$IMAGE" | sed -n "s/^$VERSION //p")
            [ "$have" != "$REVISION" ] || exit 0
            [ "$attempt" = 5 ] || sleep 10
          done
          echo "::error::$IMAGE:$VERSION is missing or not from $REVISION; run the image workflow again with tag v$VERSION"
          exit 1
