name: release-plz

on:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: tag and release
        id: release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tags pushed with the default token do not start other workflows,
      # but workflow_dispatch does, so start the build explicitly
      - name: build artifacts
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          # only the lanlord binary package is built, not its library crates
          tag=$(echo "$RELEASES" | jq -r '[.[] | select(.package_name == "lanlord")][0].tag // empty')
          if [ -n "$tag" ]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f tag="$tag"
            # the two component images are published under the same version
            gh workflow run image.yml --repo "$GITHUB_REPOSITORY" -f tag="$tag"
          fi

  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: open or update the release pr
        id: release_pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CHANGELOG.md is hand-written, so the release pr promotes [Unreleased]
      # to the new version's section. skipped when there is no release pr,
      # and a no-op when the section is already there
      - name: promote the unreleased changelog section
        if: steps.release_pr.outputs.pr != ''
        env:
          PR: ${{ steps.release_pr.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(echo "$PR" | jq -r '.head_branch // empty')
          [ -n "$branch" ] || exit 0
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lanlord") | .version')
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            exit 0
          fi
          sed -i "s/^## \[Unreleased\]\$/## [Unreleased]\n\n## [$version] - $(date -u +%F)/" CHANGELOG.md
          if git diff --quiet; then
            exit 0
          fi
          # commit through the contents api so github signs it; a plain
          # git push from the runner would be unsigned
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$branch" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" \
            -f message="docs(changelog): promote unreleased to $version" \
            -f content="$(base64 -w0 CHANGELOG.md)" \
            -f sha="$sha" \
            -f branch="$branch" > /dev/null
