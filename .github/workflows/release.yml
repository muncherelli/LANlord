name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build, like v0.2.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, flags: "" }
          - { name: macos-x86_64, os: macos-15-intel, flags: "" }
          - { name: linux-x86_64, os: ubuntu-latest, flags: "" }
          - { name: linux-x86_64-headless, os: ubuntu-latest, flags: "--no-default-features" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, flags: "" }
          - { name: linux-arm64-headless, os: ubuntu-24.04-arm, flags: "--no-default-features" }
          - { name: windows-x86_64, os: windows-latest, flags: "" }
          - { name: windows-arm64, os: windows-11-arm, flags: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: install gui libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev
          libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libgl1-mesa-dev
      - run: cargo build --release --locked -p lanlord ${{ matrix.flags }}

      # signing hook (not enabled yet): sign and notarize the macos binary
      # here with the developer id certificate once the secrets exist.

      - name: package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          out="lanlord-$TAG-${{ matrix.name }}"
          mkdir "$out"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/lanlord.exe "$out/"
            7z a "$out.zip" "$out" >/dev/null
            asset="$out.zip"
          else
            cp target/release/lanlord "$out/"
            tar czf "$out.tar.gz" "$out"
            asset="$out.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ASSET }}
      - name: upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
