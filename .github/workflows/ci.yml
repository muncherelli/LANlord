name: ci

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: install gui libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev
          libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libgl1-mesa-dev libpam0g-dev
      # the playbook render tests skip themselves without ansible, so install it where it is easy
      - name: install ansible for the playbook tests
        if: runner.os != 'Windows'
        run: |
          python3 -m venv "$HOME/ansible-venv"
          "$HOME/ansible-venv/bin/pip" install --quiet ansible-core
          echo "$HOME/ansible-venv/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p lanlord-tui --all-targets --features devtools --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p lanlord-ui -p lanlord-tui --features lanlord-ui/devtools,lanlord-tui/devtools --locked
      # a bash script: it needs the unix tools, so not on a windows runner
      - if: runner.os != 'Windows'
        run: tools/test-ghcr-own-versions.sh

  headless:
    name: build without gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p lanlord --no-default-features --locked
      # the gateway build, with the web server
      - run: cargo clippy -p lanlord --no-default-features --features webui --all-targets --locked -- -D warnings
      - run: cargo test -p lanlord --no-default-features --features webui --locked

  # the linux release builds must keep running on glibc 2.17: build them the way release.yml does
  old-glibc:
    name: linux builds on glibc 2.17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: old-glibc
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild@0.24.1
      - name: install gui libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev
          libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libgl1-mesa-dev
      - name: build and check the client, the server and the login helper
        run: |
          tools/pam-stub.sh x86_64 "$RUNNER_TEMP/pam"
          export RUSTFLAGS="-L native=$RUNNER_TEMP/pam"
          target=x86_64-unknown-linux-gnu.2.17
          cargo zigbuild --release --locked --target $target -p lanlord
          cp target/x86_64-unknown-linux-gnu/release/lanlord client
          cargo zigbuild --release --locked --target $target -p lanlord --no-default-features --features webui
          cargo zigbuild --release --locked --target $target -p lanlord-auth-helper
          tools/check-glibc.sh 2.17 client target/x86_64-unknown-linux-gnu/release/lanlord target/x86_64-unknown-linux-gnu/release/lanlord-auth-helper

  run-as-caller:
    name: run as the caller (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # the gateway's operations service is root, and a command it runs for a signed-in account
      # must run as that account: this test needs root to make an account and switch to it
      # build as the runner (root has no rustup toolchain), then run the test binary as root
      - name: build the test binary
        run: |
          cargo test -p lanlord-core --locked --no-run --message-format=json > build.json
          jq -r 'select(.profile.test and .target.name=="lanlord_core") | .executable // empty' build.json | tail -1 > bin.path
          test -x "$(cat bin.path)"
      # the grep fails loudly if the test is renamed or filtered out
      - name: run the root-only test as root
        run: |
          sudo "$(cat bin.path)" --ignored --exact ops::tests::root_a_local_run_is_the_callers_uid_and_groups_in_a_clean_environment --nocapture | tee out
          grep -q "test result: ok. 1 passed" out
      # the operations service serves the accounts of the gateway itself on a local socket, each as
      # the account its uid belongs to: this needs root to make an account and connect as it
      - name: build the operations service test binary
        run: |
          cargo test -p lanlord --no-default-features --features webui --locked --no-run --message-format=json > service.json
          jq -r 'select(.profile.test and .target.name=="lanlord") | .executable // empty' service.json | tail -1 > service.path
          test -x "$(cat service.path)"
      - name: run the local socket test as root
        run: |
          sudo "$(cat service.path)" --ignored --exact operations_service::tests::root_a_local_peer_is_served_as_its_own_account_and_cannot_name_root --nocapture | tee service.out
          grep -q "test result: ok. 1 passed" service.out

  wasm:
    name: model builds for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check -p lanlord-model --target wasm32-unknown-unknown --locked
      # the app layer without the desktop backends: the browser demo (fake) and the web ui (http)
      - run: cargo check -p lanlord-app --target wasm32-unknown-unknown --no-default-features --features fake --locked
      - run: cargo clippy -p lanlord-app --target wasm32-unknown-unknown --no-default-features --features fake --locked -- -D warnings
      - run: cargo clippy -p lanlord-ui --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings
      - run: cargo clippy -p lanlord-ui --target wasm32-unknown-unknown --no-default-features --features demo --locked -- -D warnings
      - run: cargo clippy -p lanlord-ui --target wasm32-unknown-unknown --no-default-features --features devtools --locked -- -D warnings
      # release and image builds must never carry the developer tools
      - run: tools/check-no-devtools.sh

  web:
    name: web ui builds for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy -p lanlord-web --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: trunk@0.22.1
      - run: tools/build-web.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: target/web-dist

  coverage:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: install gui libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev
          libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libgl1-mesa-dev libpam0g-dev
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      - name: run tests with coverage
        run: cargo llvm-cov --workspace --features lanlord/webui,lanlord-ui/devtools,lanlord-tui/devtools --locked --lcov --output-path lcov.info
      - name: coverage summary
        run: cargo llvm-cov report --summary-only
      - name: python tests
        run: |
          python3 -m pip install --only-binary :all: coverage==7.17.3 ansible-core==2.22.0 jinja2==3.1.6 PyYAML==6.0.3
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m coverage run --branch -m unittest discover -s ansible/tests
          python3 -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
      - name: scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          # on pull requests, wait for sonarcloud to finish so the gate and the issue check below
          # see this analysis; trunk only reports, because its gate has no new-code baseline to
          # judge and would fail every push
          args: >
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/lcov.info
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=600
      - name: no new sonarcloud issues
        if: env.SONAR_TOKEN != '' && github.event_name == 'pull_request'
        run: tools/sonar-gate.sh ${{ github.event.pull_request.number }}
