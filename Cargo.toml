[workspace]
resolver = "2"
members = ["crates/model", "crates/core", "crates/app", "crates/lanlord", "crates/ui", "crates/tui", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lanlord-app = { path = "crates/app", version = "0.1.0" }
lanlord-model = { path = "crates/model", version = "0.1.0" }
serde_json = "1"
