[workspace]
# binaries are published to github releases, not crates.io
publish = false
# we do not publish to crates.io, so the git tags are what count as released
git_only = true
git_release_enable = false
git_tag_enable = false
changelog_update = false
# CHANGELOG.md is written by hand; the release workflow promotes [Unreleased]
pr_body = """
## release

{% for release in releases %}* `{{ release.package }}`: {{ release.next_version }}
{% endfor %}
"""

[[package]]
name = "lanlord"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = false

[[package]]
name = "lanlord-model"
changelog_update = false
git_release_enable = false
git_tag_enable = false

