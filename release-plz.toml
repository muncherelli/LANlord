[workspace]
# binaries are published to github releases, not crates.io
publish = false
# we do not publish to crates.io, so the git tags are what count as released
git_only = true
git_release_enable = false
git_tag_enable = false
changelog_update = true
# the sections and which commits go in them (feat, fix, perf and refactor; not chore, ci or test)
changelog_config = "cliff.toml"
pr_body = """
## release

{% for release in releases %}* `{{ release.package }}`: {{ release.next_version }}
{% endfor %}
{% for release in releases %}{% if release.changelog %}### {{ release.package }}

{{ release.changelog }}
{% endif %}{% endfor %}
"""

[[package]]
name = "lanlord"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"

[[package]]
name = "lanlord-model"
changelog_update = false
git_release_enable = false
git_tag_enable = false

[[package]]
name = "lanlord-core"
changelog_update = false
git_release_enable = false
git_tag_enable = false

[[package]]
